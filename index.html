    openColophon(true);
    const d = body.querySelector(".disclaimer");
    if (d){
      // 用相对矩形的差值定位，避免 offsetTop 受定位父元素影响
      const gap = d.getBoundingClientRect().top - body.getBoundingClientRect().top;
      body.scrollTop = Math.max(0, body.scrollTop + gap - 14);
      d.classList.add("flash");
      setTimeout(() => d.classList.remove("flash"), 1400);
    }
  };
  document.getElementById("colophon").addEventListener("click", e => { if (e.target.id === "colophon") openColophon(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") openColophon(false); });

  // 窄屏（手机）上，索引侧栏和关卡面板几乎都会占满屏幕，
  // 两者同时展开等于互相遮盖。所以打开关卡时先把索引收起来，
  // 关掉面板后再还原，不影响桌面端和用户自己收起的选择。
  const isNarrow = () => window.matchMedia("(max-width: 820px)").matches;  // 与 CSS 断点保持一致
  let idxWasOpen = false;

  function openLevel(id, fly){
    const l = byId(id);
    if (!l) return;
    if (l.ly !== state.layer) setLayer(l.ly);
    if (isNarrow() && idxEl.classList.contains("open")){
      idxWasOpen = true;
      setIndexOpen(false);
    }
    state.sel = id;
    document.querySelectorAll(".mk.sel").forEach(e => e.classList.remove("sel"));
    const mk = document.querySelector(`.mk[data-id="${id}"]`);
    if (mk) mk.classList.add("sel");
    render(l);
    panel.classList.add("open");
    if (fly) centerOn(l.px, l.py, Math.max(state.scale, 0.95));
    document.querySelectorAll(".ai.act").forEach(e => e.classList.remove("act"));
    const ai = document.querySelector(`.ai[data-id="${id}"]`);
    if (ai){ ai.classList.add("act"); ai.scrollIntoView({block:"nearest"}); }
    tip.classList.remove("on");
  }

  function closePanel(){
    panel.classList.remove("open");
    state.sel = null;
    document.querySelectorAll(".mk.sel").forEach(e => e.classList.remove("sel"));
    document.querySelectorAll(".ai.act").forEach(e => e.classList.remove("act"));
    if (idxWasOpen){
      idxWasOpen = false;
      if (isNarrow()) setIndexOpen(true);
    }
  }

  function render(l){
    const a = AREAS[l.a] || {cn:l.a, n:1};   // 仅用于兜底判断，显示一律走 AR(l.a)
    const g = G[l.a];
    const grp = groupOf(l.a);
    const done = state.done.has(l.id);

    const E = isEN();
    phead.innerHTML = `
      <div class="parea" style="--c:var(--g-${grp})"><i></i>${esc(AR(l.a))}<span class="maplayer">${LAYER_NAME(l.ly)}</span>${urgencyBadge(l)}</div>
      <h2>${esc(l.t)}</h2>
      <div class="pmeta">#${pad(l.id)} · ${E ? "coords" : "坐标"} ${l.x}, ${l.y}${l.z !== 0 ? (E ? " · height " + l.z : " · 高度 " + l.z) : ""} · ${done ? (E ? "cleared" : "已通过") : (E ? "not recorded" : "未记录")}</div>
      <button class="pclose" id="pclose" aria-label="${E ? "Close" : "关闭"}">×</button>`;
    document.getElementById("pclose").onclick = closePanel;

    let html = "";

    if (l.i){
      html += `<div class="sec"><h3>${E ? "Level board" : "本关棋盘"}</h3>
        <img class="board" src="assets/levels/${l.n}.jpg" alt="${esc(l.t)}${E ? " board" : " 棋盘"}" loading="lazy">
        <div class="boardcap">${E ? "Community-captured layout. Click to enlarge — check the opening terrain against your version." : "社区标注的关卡布局截图，点图放大，用来核对开局地形是否与你手上版本一致。"}</div></div>`;
    }

    if (g){
      const gw = guideText(l.a, "w", g.w);
      const gt = guideTips(l.a, g.tips);
      html += `<div class="sec"><h3>${esc(AR(l.a))}${E ? " · how to play" : " · 打法"}</h3><p>${esc(gw)}</p></div>`;
      html += `<div class="sec"><h3>${E ? "Field notes" : "实战要点"}</h3><ul class="tips">${gt.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
    }

    if (l.s){
      const peers = LEVELS.filter(x => x.a === l.a && x.s)
        .map(x => ({id:x.id, n:unpack(x.s).length}))
        .sort((p, q) => p.n - q.n);
      const rank = peers.findIndex(p => p.id === l.id) + 1;
      const rankText = peers.length > 3 && rank
        ? (isEN() ? `shortest of ${peers.length} in this area` : `在该区域 ${peers.length} 关里第 ${rank} 短`)
        : "";
      // 走法排序：有另解时把另解放前面。
      // 主解由 WikiTactics 的录像转录而来（上游 scripts/export_solutions.cmd 可查），
      // 玩家实测部分关卡照走根本走不通；另解是人工整理验证过的，可靠得多。
      const primary = l.s2 || l.s;
      const secondary = l.s2 ? l.s : "";
      const primaryIsAlt = !!l.s2;
      // 主解里出现 B 说明这条是录像转录的，不是实测走法。
      // 有另解时另解已顶上；没有另解的只能如实标注，别让人照着走死路。
      const unverified = !primaryIsAlt && /B/.test(primary);
      html += `<div class="sec"><h3>${E ? "Step-by-step" : "逐步走法"}</h3>
        ${unverified ? `<div class="altWarn">${E ? "This route was transcribed from a wiki replay and is <b>not verified</b>. Some levels can't be cleared by following it as written. The directions are broadly right — if you get stuck, undo a few steps and try a different order, or use the external guides below." : "这条走法由 wiki 录像转录，<b>未经实测验证</b>。部分关卡照着走会卡住。方向序列大体是对的 —— 走不通时建议撤回上一步换个顺序，或参考下面的外部攻略。"}</div>` : ""}
        ${platBarHTML()}${keyGridHTML()}${solHTML(primary, primaryIsAlt ? "" : rankText)}
        <div class="routeNote">${E ? routeNoteEN() : routeNoteZH()}</div>
        ${secondary ? `<details class="alt"><summary>${E ? `Another route (${unpack(secondary).length} steps)` : `另一条走法（${unpack(secondary).length} 步）`}</summary>${solHTML(secondary)}${primaryIsAlt ? `<div class="altWarn">${E ? "Transcribed from a replay recording; on some levels this route doesn't actually work. Use the route above." : "这条由 wiki 的录像回放转录，部分关卡照走走不通（路线本身有误）。优先用上面的走法。"}</div>` : ""}</details>` : ""}
        </div>`;
    } else {
      html += `<div class="sec"><h3>${E ? "Step-by-step" : "逐步走法"}</h3><div class="none">${E ? "No public step-by-step solution for this level yet. Try the area notes below, or jump to the full area guide." : "这一关暂时没有收录到公开的逐步解法。先按下面的区域打法推导，卡住可以直接跳到该区域的完整攻略页。"}</div></div>`;
    }

    // 外部攻略：图文（定位到具体题目）+ B 站讲解（精确到分P与时间点）+ YouTube
    const wt = (window.WT || {})[l.n];
    const meta = window.WT_META || {};
    const mmss = s => {
      s = Math.max(0, Math.round(s));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
      return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`;
    };
    let guideRows = "";

    // 图文攻略
    if (wt && wt.page){
      const ht = wt.hash || "";
      // 纯数字锚点如「第-5-题」不需要编码，中文锚点必须编码
      const frag = /^[\w-]+$/.test(ht) ? ht : encodeURIComponent(ht);
      guideRows += `<a href="https://sinkingstarwalkthrough.com/zh/${wt.page}/${frag ? "#" + frag : ""}" target="_blank" rel="noopener">
        <span class="gi wt">${E ? "TXT" : "文"}</span>
        <span class="gt">${E ? "Step-by-step writeup" : "攻略站分步解法"}<small>${E ? "link jumps to " : ""}${esc(wt.label || (E ? "entry" : "对应条目"))}${E ? " (that site's numbering)" : " · 定位到该题"}</small></span>
        <span class="go">↗</span></a>`;
    }

    // B 站讲解：主数据源，覆盖全部关卡
    if (wt && wt.v && wt.v.length){
      const bv = meta.bvid || "BV13FH96bE4m";
      wt.v.forEach((seg, i) => {
        const part = (meta.parts && meta.parts[String(seg.p)]) || null;
        const pt = part && part.title ? part.title.replace(/\s+/g, " ").trim() : "";
        // 该段时长；过长说明这一 P 只是大致定位，标出来
        const dur = seg.end != null ? seg.end - seg.t : null;
        const rough = dur != null && dur > 300;
        const uncertain = seg.unc != null && seg.unc >= 5;
        const bits = [`P${seg.p} · ${mmss(seg.t)}`];
        if (dur != null) bits.push(E ? `~${mmss(dur)}` : `约 ${mmss(dur)}`);
        if (rough || uncertain) bits.push(E ? "position approximate" : "位置为大致估计");
        const blLabel = wt.v.length > 1 ? "P" + seg.p : (E ? "BILI" : "B站");
        const blTitle = wt.v.length > 1
          ? (E ? `Commentary part ${i + 1}` : `第 ${i + 1} 段讲解`)
          : (E ? "Bilibili commentary" : "B 站思路讲解");
        guideRows += `<a href="https://www.bilibili.com/video/${bv}?p=${seg.p}&t=${Math.floor(seg.t)}" target="_blank" rel="noopener">
          <span class="gi bl">${blLabel}</span>
          <span class="gt">${blTitle}${pt ? `<small>${esc(pt.slice(0, 34))}</small>` : ""}<small>${bits.join(" · ")}${E && pt ? " · original video title" : ""}</small></span>
          <span class="go">↗</span></a>`;
      });
    } else if (!wt || !wt.v){
      guideRows += `<div class="gmiss">${E ? "No matching video segment for this level." : "这一关没有收录到对应的视频片段。"}</div>`;
    }

    // YouTube：走回源搜索（攻略站的 YT 时刻是另一套视频，与 B 站的分P不对应）
    const ytSearch = "https://www.youtube.com/results?search_query=" +
      encodeURIComponent("Order of the Sinking Star " + l.t);
    guideRows += `<a href="${esc(l.yt || ytSearch)}" target="_blank" rel="noopener">
      <span class="gi yt">YT</span>
      <span class="gt">YouTube ${l.yt ? (E ? "video" : "本关视频") : (E ? "search" : "搜索本关")}<small>${l.yt ? (E ? "Community recording" : "社区收录的录像") : (E ? "Search by level name" : "按关卡名搜索")}</small></span>
      <span class="go">↗</span></a>`;

    html += `<div class="sec"><h3>${E ? "External guides" : "外部攻略"}</h3><div class="guide">${guideRows}</div></div>`;

    // 站内工具；视频类入口已统一收进上方「外部攻略」，这里不重复
    const player = "https://joric.github.io/ootss/play.html#" + encodeURIComponent(l.n);
    html += `<div class="sec"><h3>${E ? "More" : "继续查"}</h3><div class="links">
      <a href="${player}" target="_blank" rel="noopener">${E ? "Community player auto-demo" : "社区播放器自动演示"} ↗</a>
      <a href="https://sinkingstarwalkthrough.com/${E ? "" : "zh/"}?utm_source=ootss-map" target="_blank" rel="noopener">${E ? "Walkthrough home" : "攻略站首页"} ↗</a>
      <button class="lnkbtn" data-area="${esc(l.a)}">${E ? "All levels in this area" : "该区域全部关卡（站内列表）"}</button>
    </div></div>`;

    pbody.innerHTML = html;
    pbody.scrollTop = 0;

    pbody.querySelectorAll("[data-plat]").forEach(b => {
      b.onclick = () => {
        if (state.plat === b.dataset.plat) return;
        state.plat = b.dataset.plat;
        save();
        const st = pbody.scrollTop;
        render(l);
        pbody.scrollTop = st;
      };
    });
    pbody.querySelectorAll("[data-area]").forEach(b => {
      b.onclick = () => openAreaInIndex(b.dataset.area);
    });
    pbody.querySelectorAll("[data-raw]").forEach(b => {
      b.onclick = () => {
        const box = b.closest(".sol").querySelector(".rawsec");
        const on = box.classList.toggle("on");
        b.textContent = on ? (isEN() ? "Hide raw string" : "隐藏原始串") : (isEN() ? "Show raw string" : "显示原始串");
      };
    });
    pbody.querySelectorAll(".board").forEach(img => {
      img.onclick = () => { lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add("on"); };
    });
    pbody.querySelectorAll("[data-copy]").forEach(b => {
      b.onclick = async () => {
        const t = b.dataset.copy;
        try{
          await navigator.clipboard.writeText(t);
        }catch(e){
          const ta = document.createElement("textarea");
          ta.value = t; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); }catch(_){}
          ta.remove();
        }
        const old = b.textContent;
        b.textContent = isEN() ? "Copied ✓" : "已复制 ✓";
        setTimeout(() => { b.textContent = old; }, 1200);
      };
    });

    btnDone.classList.toggle("on", done);
    btnDone.textContent = done ? (isEN() ? "✓ Cleared (click to undo)" : "✓ 已通过（点击取消）") : (isEN() ? "Mark as cleared" : "标记为已通过");

    const idx = LEVELS.indexOf(l);
    document.getElementById("prev").disabled = idx <= 0;
    document.getElementById("next").disabled = idx >= LEVELS.length - 1;
  }

  btnDone.onclick = () => {
    if (state.sel == null) return;
    const was = state.done.has(state.sel);
    if (was) state.done.delete(state.sel);
    else state.done.add(state.sel);
    const ok = save();
    // 存不住时不要假装成功：回滚这次改动并说明原因，
    // 否则用户以为记下了，刷新才发现白做。
    if (!ok){
      if (was) state.done.add(state.sel); else state.done.delete(state.sel);
      render(byId(state.sel));
      showSaveWarning(true);
      return;
    }
    refreshProgress();
    render(byId(state.sel));
  };
  document.getElementById("prev").onclick = () => {
    const i = LEVELS.findIndex(l => l.id === state.sel);
    if (i > 0) openLevel(LEVELS[i-1].id, true);
  };
  document.getElementById("next").onclick = () => {
    const i = LEVELS.findIndex(l => l.id === state.sel);
    if (i < LEVELS.length-1) openLevel(LEVELS[i+1].id, true);
  };
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){ if (lb.classList.contains("on")){ lb.classList.remove("on"); return; } closePanel(); document.getElementById("sres").classList.remove("on"); }
    if (panel.classList.contains("open")){
      if (e.key === "ArrowLeft") document.getElementById("prev").click();
      if (e.key === "ArrowRight") document.getElementById("next").click();
    }
  });

  /* ---------- 索引 ---------- */
  const idxEl = document.getElementById("index");
  function buildIndex(){
    // 只列当前大地图的关卡：每个区域只属于一个层，所以按层过滤即可
    const onLayer = LEVELS.filter(l => l.ly === state.layer);
    if (!onLayer.length){
      document.getElementById("ilist").innerHTML =
        `<div class="iempty">${isEN() ? "No level data for this layer" : "这一层还没有关卡数据"}</div>`;
      return;
    }

    // 先按「套」分组（枢纽 / 北方 / …），再按层内区域列
    const groups = {};
    onLayer.forEach(l => { const g = groupOf(l.a); (groups[g] = groups[g] || new Set()).add(l.a); });
    const order = ["hub","north","east","south","west","hybrid","3d","end"];
    let html = "", nArea = 0;
    order.forEach(g => {
      if (!groups[g]) return;
      const areas = [...groups[g]];
      areas.sort((x,y) => AREAS[y].n - AREAS[x].n);
      html += `<div class="gsec"><h4>${esc(GROUP_NAME(g))}<em>${
        areas.reduce((s,a) => s + LEVELS.filter(l => l.a === a && l.ly === state.layer).length, 0)
      } ${isEN() ? "levels" : "关"}</em></h4>`;
      areas.forEach(a => {
        nArea++;
        // 组内只统计与当前层一致的关卡（数据上不会跨层，这里仍做防御）
        const ls = LEVELS.filter(l => l.a === a && l.ly === state.layer);
        const doneN = ls.filter(l => state.done.has(l.id)).length;
        const allDone = doneN === ls.length;
        html += `<div class="ag" data-area="${a}" data-done="${doneN}" data-n="${ls.length}" style="--c:var(--g-${g})">
          <div class="ahrow">
            <button class="aexp" title="${isEN() ? "Expand / collapse this area's levels" : "展开 / 收起这一组的关卡列表"}" aria-label="${isEN() ? "Expand level list" : "展开关卡列表"}">
              <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
            </button>
            <button class="ah" data-area="${a}" title="${isEN() ? "Show only " + esc(AR(a)) + " on the map" : "在地图上只显示「" + esc(AR(a)) + "」的关卡"}"><span class="dot"></span><span>${esc(AR(a))}</span><span class="cnt">${doneN ? `${doneN}/` : ""}${ls.length}</span></button>
            <button class="achk${allDone ? " on" : ""}" data-act="area" data-area="${a}" title="${allDone ? (isEN() ? "Clear this group's marks" : "取消这一组的已通过标记") : (isEN() ? "Mark this whole group as cleared" : "把这一组全部标为已通过")}">${isEN() ? "ALL" : "全"}</button>
          </div>
          <div class="alist">${ls.map(l=>{
            const u = urgencyOf(waitStats(l.s));
            return `<button class="ai" data-id="${l.id}"><span>${esc(l.t)}</span>${
              u ? `<small class="bdg b-${u.k}" title="${esc(u.tip)}">${URG_ICON[u.k]}</small>` : ""
            }</button>`;
          }).join("")}</div>
        </div>`;
      });
      html += `</div>`;
    });
    document.getElementById("ilist").innerHTML = html;

    // 头部摘要与筛选高亮统一由 updateSummary 负责
    markActiveArea();

    // 点区域名 = 在地图上筛选该区域（再点一次取消）；点右侧箭头 = 展开/收起关卡列表
    document.querySelectorAll(".ah").forEach(b => {
      b.onclick = () => setArea(b.dataset.area);
    });
    document.querySelectorAll(".aexp").forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const ag = b.closest(".ag");
        const isOpen = ag.classList.contains("open");
        document.querySelectorAll(".ag.open").forEach(x => x.classList.remove("open"));
        if (!isOpen) ag.classList.add("open");
      };
    });
    document.querySelectorAll(".ai").forEach(b => {
      b.onclick = () => openLevel(+b.dataset.id, true);
    });
    document.querySelectorAll(".achk").forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const a = b.dataset.area;
        const ls = LEVELS.filter(l => l.a === a && l.ly === state.layer);
        batchSet(ls, !ls.every(l => state.done.has(l.id)));
      };
    });

    // 索引头部的两个全局批量按钮
    document.getElementById("bMarkLayer").onclick = () => {
      const ls = LEVELS.filter(l => l.ly === state.layer);
      const left = ls.filter(l => !state.done.has(l.id));
      if (!left.length){
        if (confirm(`「${LAYER_NAME(state.layer)}」的 ${ls.length} 关已全部标记。要取消这一层的所有标记吗？`))
          batchSet(ls, false);
        return;
      }
      if (confirm(`把「${LAYER_NAME(state.layer)}」这一层的 ${left.length} 关全部标为已通过？\n（该层共 ${ls.length} 关，已标记 ${ls.length - left.length} 关）`))
        batchSet(ls, true);
    };
    // 导出/导入：解决换域名、换浏览器后进度带不走的问题。
    // 旧域名 -389 已删除，而 localStorage 按域名隔离，用户在新域名看到进度「复位」多半是这原因。
    document.getElementById("bExport").onclick = () => {
      const data = { app: "ootss-map", version: 2, exported: new Date().toISOString(),
                     done: [...state.done].sort((a, b) => a - b), plat: state.plat };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ootss-progress-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    };

    document.getElementById("bImport").onclick = () => document.getElementById("fImport").click();
    document.getElementById("fImport").onchange = e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d2 = JSON.parse(rd.result);
          if (!Array.isArray(d2.done)) throw new Error("bad file");
          const valid = d2.done.filter(n => Number.isInteger(n) && byId(n));
          if (!valid.length) throw new Error("empty");
          const n = valid.length;
          const msg = isEN()
            ? `Import ${n} cleared levels? This replaces your current progress (${state.done.size} records).`
            : `导入 ${n} 条通关记录？这会覆盖当前的 ${state.done.size} 条记录。`;
          if (!confirm(msg)) return;
          const backup = new Set(state.done);
          state.done = new Set(valid);
          if (d2.plat && ["pc","xbox","ps","sw"].includes(d2.plat)) state.plat = d2.plat;
          if (!save()){
            state.done = backup;
            showSaveWarning(true);
          } else {
            refreshProgress();
            if (state.sel != null && byId(state.sel)) render(byId(state.sel));
          }
        } catch (err) {
          alert(isEN() ? "That file isn't a valid progress export." : "这个文件不是有效的进度导出文件。");
        }
        e.target.value = "";
      };
      rd.readAsText(f);
    };

    document.getElementById("bClear").onclick = () => {
      if (!state.done.size) return;
      if (confirm(isEN() ? `Clear all ${state.done.size} cleared records? This cannot be undone.` : `清空全部 ${state.done.size} 条已通过记录？此操作不可撤销。`))
        batchSet(LEVELS, false);
    };
  }

  // 批量设置已通过状态；一次性写 localStorage，避免逐关 save()
  function batchSet(list, on){
    if (!list.length) return;
    const backup = new Set(state.done);
    if (on) list.forEach(l => state.done.add(l.id));
    else list.forEach(l => state.done.delete(l.id));
    if (!save()){
      state.done = backup;           // 存不住就整体回滚，避免界面与实际不一致
      showSaveWarning(true);
      refreshProgress();
      return;
    }
    refreshProgress();
    if (state.sel != null && byId(state.sel)) render(byId(state.sel));
  }

  /* ---------- 搜索 ---------- */
  const q = document.getElementById("q"), sres = document.getElementById("sres");
  q.addEventListener("input", () => {
    const v = q.value.trim();
    state.q = v;
    applyFilter();
    if (!v){ sres.classList.remove("on"); return; }
    const hits = LEVELS.filter(l => l.t.toLowerCase().includes(v.toLowerCase()) ||
      AR(l.a).toLowerCase().includes(v) || ((AREAS[l.a] || {}).cn || "").includes(v)
      || LAYER_NAME(l.ly).toLowerCase().includes(v)).slice(0, 20);
    sres.innerHTML = hits.length
      ? hits.map(l => `<button data-id="${l.id}">${esc(l.t)}<small>${esc(AR(l.a))} · ${LAYER_NAME(l.ly)} · #${pad(l.id)}</small></button>`).join("")
      : `<div style="padding:12px;color:var(--dim);font-size:12px">${isEN() ? "No matching levels" : "没有匹配的关卡"}</div>`;
    sres.classList.add("on");
    sres.querySelectorAll("button").forEach(b => {
      b.onclick = () => { sres.classList.remove("on"); q.value = ""; state.q = ""; applyFilter(); openLevel(+b.dataset.id, true); };
    });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) sres.classList.remove("on"); });

  // 侧栏开关：把手常驻在侧栏右缘，收起时箭头朝右（点这里展开），展开时朝左（点这里收起）
  const idxHandle = document.getElementById("idxHandle");
  function placeHandle(on){
    // 展开时贴侧栏右缘，收起时贴屏幕左缘
    const w = idxEl.getBoundingClientRect().width || 290;
    idxHandle.style.left = on ? (10 + w) + "px" : "0px";
  }
  function setIndexOpen(on){
    idxEl.classList.toggle("open", on);
    idxHandle.classList.toggle("closed", !on);
    idxHandle.title = on ? (isEN() ? "Collapse index (←)" : "收起关卡索引（←）") : (isEN() ? "Expand index (→)" : "展开关卡索引（→）");
    idxHandle.setAttribute("aria-expanded", on ? "true" : "false");
    idxHandle.setAttribute("aria-label", isEN() ? (on ? "Collapse level index" : "Expand level index") : (on ? "收起关卡索引" : "展开关卡索引"));
    placeHandle(on);
  }
  idxHandle.onclick = () => {
    const on = !idxEl.classList.contains("open");
    setIndexOpen(on);
    lsSet("ootss-idx", on ? "1" : "0");
  };
  // 索引从顶栏移到了左侧栏，默认展开；用户收起后记住他的选择
  setIndexOpen(lsGet("ootss-idx") !== "0");
  window.addEventListener("resize", () => placeHandle(idxEl.classList.contains("open")));
  // 键盘：焦点在侧栏内时 Esc 收起
  idxEl.addEventListener("keydown", e => {
    if (e.key === "Escape"){
      setIndexOpen(false);
      lsSet("ootss-idx", "0");
      idxHandle.focus();
    }
  });

  // 从关卡面板跳到「该区域全部关卡」：打开索引、滚到该区域并展开，当前关高亮
  function openAreaInIndex(areaId){
    setIndexOpen(true);
    const ag = document.querySelector(`.ag[data-area="${areaId}"]`);
    if (!ag) return;
    document.querySelectorAll(".ag.open").forEach(x => x.classList.remove("open"));
    ag.classList.add("open");
    ag.scrollIntoView({ block:"center" });
    const act = ag.querySelector(".ai.act") || ag.querySelector(".ai");
    if (act) act.focus({ preventScroll:true });
  }

  /* ---------- 启动 ---------- */
  load();
  applyLang();          // 按浏览器语言或上次选择，先把静态文案定下来

  // zoomanim 在缩放动画的每一帧都会触发，用来逐帧同步覆盖层，
  // 这样标记与瓦片是「一起动」，而不是等动画结束才跳过去。
  map.on("zoomanim", onZoomAnim);
  map.on("zoomend", endZoomAnim);
  map.on("zoom zoom move moveend viewreset", onViewChange);
  // 允许稍微拖出边界一点，但不要用 pad 太大 —— pad 会连带限制可缩放的层级，
  // 之前 0.15 把初始视图压到了 z1.5，地图只占屏幕中间一小块。
  map.setMaxBounds(bounds.pad(0.02));

  buildIndex();
  refreshProgress();

  const maptabs = document.getElementById("maptabs");
  maptabs.querySelectorAll("button").forEach(b => {
    const m = MAPS[b.dataset.layer];
    if (m) b.querySelector("b").textContent = m.n;
    b.onclick = () => setLayer(b.dataset.layer);
  });

  setLayer(state.layer);

  // 顺序很重要：先给 map 定好中心与缩放，再建标记与标签。
  // 否则 positionMkLayer() 里的 latLngToLayerPoint 会抛
  // "Set map center and zoom first."，标记和地名都挂不上去。
  map.fitBounds(bounds, { padding: [8, 8], animate: false });
  buildMarkers();
  buildLabels();
  // applyFilter 必须在标记建好之后再跑一次：
  // setLayer 里虽然也调了，但那时标记还没创建，等于空跑，
  // 结果首屏把三层 920 个标记全显示出来了。
  applyFilter();
  onViewChange();


  const hash = decodeURIComponent(location.hash.replace("#",""));
  if (hash){
    const hit = LEVELS.find(l => l.n === hash);
    if (hit) setTimeout(() => openLevel(hit.id, true), 300);
  }
})();
</script>
</body>
</html>
