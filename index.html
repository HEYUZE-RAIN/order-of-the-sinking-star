<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉星之序 · 交互地图 | 920 个关卡位置与解法</title>
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<style>
:root{
  --bg:#151a2b;
  --surface:#1d263b;
  --surface-2:#232f47;
  --line:#3e4b66;
  --line-soft:#2c3a55;
  --ink:#f2eee5;
  --muted:#bbc6d8;
  --dim:#8b97ad;
  --accent:#e2be7d;
  --accent-dim:#a98d55;
  --header-bg:#151a2bf2;
  --radius:5px;
  --h:56px;
  --g-hub:#d7dbe6;
  --g-north:#ef6a5b;
  --g-east:#7fb2ff;
  --g-south:#4fd1b5;
  --g-west:#b28dff;
  --g-hybrid:#f0c05a;
  --g-3d:#9aa7c7;
  --g-end:#ff9b4a;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.serif{font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;}

/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;height:var(--h);z-index:50;
  display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--header-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
/* 英文文案更长，窄屏上要把可让位的东西先压掉，别把右侧按钮挤出视口 */
.brand{flex-shrink:0;}
.brand span,.search{min-width:0;}
.search{flex-shrink:1;}
#maptabs{flex-shrink:0;}
/* 右侧按钮组：永不收缩，保证任何时候都点得到 */
header > .iconbtn{flex-shrink:0;}
@media (max-width:1180px){
  header{gap:8px;padding:0 10px;}
  #maptabs button{padding:0 8px;}
}
@media (max-width:1060px){
  /* 再窄一档：搜索框缩到最小，地图标签只留数字 */
  .search input{width:96px;}
  .search input:focus{width:130px;}
  .langbtn{width:58px;padding:0 7px;}
  #langLabel{font-size:10px;}
}
@media (max-width:980px){
  .brand span{display:none;}
  .hsep{display:none;}
  .search input{width:120px;}
  .search input:focus{width:150px;}
}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
.starmark{color:var(--accent);flex-shrink:0;filter:drop-shadow(0 0 5px #e2be7d55);}
.brand b{font-size:13px;letter-spacing:.26em;font-weight:700;color:var(--accent);}
.brand span{font-size:11px;letter-spacing:.14em;color:var(--dim);}
.hsep{width:1px;height:22px;background:var(--line);}
#maptabs{display:flex;gap:2px;background:#111729;border:1px solid var(--line);border-radius:6px;padding:2px;}
#maptabs button{
  height:28px;padding:0 11px;border:0;border-radius:4px;background:none;color:var(--dim);
  font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;
}
#maptabs button b{font-weight:600;font-size:10px;color:#7e8aa3;font-variant-numeric:tabular-nums;}
#maptabs button:hover{color:var(--muted);}
#maptabs button.on{background:#26324a;color:var(--accent);}
#maptabs button.on b{color:var(--accent-dim);}
.spacer{flex:1;}
.search{position:relative;flex:0 1 170px;min-width:96px;}
.search input{max-width:100%;box-sizing:border-box;}
.search input{
  width:100%;height:32px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--ink);font-size:12.5px;padding:0 10px 0 28px;outline:none;
  transition:border-color .15s;
}
.search:focus-within{flex-basis:230px;}
.search input:focus{border-color:var(--accent-dim);}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;}
.sres{
  position:absolute;top:38px;left:0;width:320px;max-height:340px;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 12px 40px #05091488;padding:4px;display:none;z-index:60;
}
.sres.on{display:block;}
.sres button{
  display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);
  padding:7px 9px;border-radius:4px;font-size:12.5px;cursor:pointer;
}
.sres button:hover{background:var(--surface-2);}
.sres small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px;}
.iconbtn{
  height:32px;padding:0 9px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--muted);cursor:pointer;font-size:12px;
  display:grid;place-items:center;white-space:nowrap;flex-shrink:0;
}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-dim);}
/* 语言切换：图标 + 当前语言，宽度固定住免得住切换时抖 */
.langbtn{display:inline-flex;align-items:center;gap:5px;padding:0 10px;width:66px;justify-content:center;box-sizing:border-box;}
.langbtn svg{opacity:.75;}
#langLabel{font-size:10.5px;letter-spacing:.02em;}

/* ---------- map ---------- */
#stage{position:fixed;inset:var(--h) 0 0 0;overflow:hidden;cursor:grab;background:#0d1220;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#stage,#stage *{user-select:none;-webkit-user-select:none;}
#stage.dragging{cursor:grabbing;}
#map{position:absolute;inset:0;background:#0d1220;}
/* 底图瓦片的观感与原整图保持一致 */
#map .leaflet-tile{filter:saturate(1.05) brightness(1.04);}
/* Leaflet 默认控件与本页风格不符，全部隐藏，改用页面自己的按钮 */
#map .leaflet-control-container{display:none;}
/* 米制比例尺对游戏地图没有意义 */
#map .leaflet-tile-container{will-change:auto;}
/* 缩放动画期间：标记与地名跟随 transform 插值，与瓦片完全同步。
   只过渡 transform，避免 --inv / --linv 变化也产生过渡导致尺寸抖动。 */
/* 缩到整图铺满时（z<2），920 个标记挤在屏幕上，降级渲染：
   去掉多重投影与渐变高光，只保留纯色圆点。 */
#markers.dense .mk{
  background:var(--c);
  box-shadow:0 0 0 1px #05070cc0;
}
#markers.dense .mk.done{
  background:var(--accent);
  box-shadow:0 0 0 1px #1a1205;
}
#markers.dense .mk::after{display:none;}

#markers.zooming,#labels.zooming{
  transition:transform .25s cubic-bezier(0,0,.25,1);
  will-change:transform;
}
#labels{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.alab{
  position:absolute;transform:translate(-50%,-50%) scale(var(--linv,1));white-space:nowrap;
  font-size:12px;line-height:1.2;letter-spacing:.03em;color:#f6ecd8;
  background:#0b1020c4;border:1px solid #e2be7d33;border-radius:999px;
  padding:2px 7px;display:none;text-shadow:0 1px 2px #000;
  box-shadow:0 1px 6px #0006;
  user-select:none;-webkit-user-select:none;
}
.alab.major{font-size:14px;font-weight:600;color:#ffe7b6;border-color:#e2be7d66;background:#0b1020d8;}
/* 英文地名普遍比中文长，字号收一点、字距收紧，避免相邻标签贴太近 */
body.en .alab{font-size:11px;letter-spacing:0;padding:2px 6px;}
body.en .alab.major{font-size:12.5px;letter-spacing:0;}
.alab.on{display:block;}
.alab.off{display:none!important;}
#markers{position:absolute;inset:0;--inv:1;}
.mk{
  position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;border:0;padding:0;cursor:pointer;transform:scale(var(--inv));
  /* 底色渐变给一点"球面"高光；三层投影 = 深色内圈压住底图 + 亮色外圈拉开对比 + 落影 */
  background:radial-gradient(circle at 34% 28%, #ffffffb0, #ffffff00 58%), var(--c);
  box-shadow:
    0 0 0 1.4px #05070ce0,
    0 0 0 2.9px #fbf6eaee,
    0 1px 5px 1px #000a;
  transition:box-shadow .15s, filter .15s;
}
.mk::after{content:"";position:absolute;inset:-6px;border-radius:50%;}
.mk:hover{box-shadow:0 0 0 1.8px #05070c, 0 0 0 4px #f2eee5, 0 0 13px 3px var(--c);z-index:9;filter:brightness(1.15);}
.mk.done{
  background:radial-gradient(circle at 34% 28%, #fffdf6cc, #ffffff00 58%), var(--accent);
  box-shadow:0 0 0 1.4px #1a1205, 0 0 0 2.9px #ffe7b6ee, 0 1px 5px 1px #000a;
}
.mk.sel{box-shadow:0 0 0 2px #05070c, 0 0 0 4.4px var(--ink), 0 0 15px 4px var(--c);}
.mk.hide{display:none;}
.g-hub{--c:var(--g-hub);} .g-north{--c:var(--g-north);} .g-east{--c:var(--g-east);}
.g-south{--c:var(--g-south);} .g-west{--c:var(--g-west);} .g-hybrid{--c:var(--g-hybrid);}
.g-3d{--c:var(--g-3d);} .g-end{--c:var(--g-end);}

#tip{
  position:fixed;z-index:70;pointer-events:none;opacity:0;transform:translate(-50%,-160%);
  background:#0f1526ee;border:1px solid var(--line);border-radius:4px;padding:5px 8px;
  font-size:11.5px;white-space:nowrap;transition:opacity .12s;color:var(--ink);
}
#tip.on{opacity:1;}
#tip i{display:block;font-style:normal;color:var(--dim);font-size:10px;margin-top:2px;}

/* ---------- hud ---------- */
#hud{
  position:fixed;left:14px;bottom:14px;z-index:40;width:250px;
  background:#151a2be8;border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(8px);padding:11px 12px;font-size:12px;
}
#hud h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.2em;color:var(--dim);font-weight:600;}
.prog{margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;}
.prog .bar{flex:1;height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;}
.legend{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);}
.legend span{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;}
.legend i{width:6px;height:6px;border-radius:50%;background:var(--c);}
.credit{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:9.5px;color:#6d7996;line-height:1.5;}
.credlink{
  background:none;border:0;padding:0;margin:0;font:inherit;color:#8d99ad;
  cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;
}
.credlink:hover{color:var(--accent);}

#zoom{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;flex-direction:column;gap:5px;}
#zoom button{
  width:32px;height:32px;background:#151a2be8;border:1px solid var(--line);border-radius:4px;
  color:var(--muted);cursor:pointer;font-size:14px;display:grid;place-items:center;backdrop-filter:blur(8px);
}
#zoom button:hover{color:var(--ink);border-color:var(--accent-dim);}

/* ---------- panel ---------- */
#panel{
  position:fixed;top:calc(var(--h) + 10px);right:10px;bottom:10px;width:400px;z-index:45;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 20px));transition:transform .28s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 18px 50px #050914aa;
}
#panel.open{transform:none;}
.phead{padding:15px 16px 13px;border-bottom:1px solid var(--line-soft);position:relative;}
.pclose{
  position:absolute;right:12px;top:12px;width:26px;height:26px;padding:0;border-radius:4px;
  display:grid;place-items:center;cursor:pointer;
  background:#ffffff0a;border:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1;
}
.pclose:hover{color:var(--ink);background:#ffffff14;border-color:var(--accent-dim);}
.parea{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;color:var(--accent);}
.parea i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);}
.phead h2{margin:7px 0 3px;font-size:17px;line-height:1.3;font-weight:600;padding-right:26px;letter-spacing:.01em;}
.pmeta{font-size:10.5px;color:var(--dim);letter-spacing:.03em;font-variant-numeric:tabular-nums;}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 20px;scrollbar-width:thin;}
.pbody::-webkit-scrollbar{width:6px;}
.pbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.sec{margin-bottom:18px;}
.sec h3{
  margin:0 0 8px;font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:600;
  display:flex;align-items:center;gap:7px;
}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line-soft);}
.sec p{margin:0;font-size:12.5px;line-height:1.8;color:var(--muted);}
.tips{margin:0;padding:0;list-style:none;}
.tips li{
  position:relative;padding:7px 10px 7px 22px;font-size:12.5px;line-height:1.7;color:var(--muted);
  background:#ffffff06;border-left:2px solid var(--accent-dim);border-radius:0 3px 3px 0;margin-bottom:5px;
}
.tips li::before{content:"›";position:absolute;left:9px;top:6px;color:var(--accent);font-weight:700;}
.board{width:100%;border:1px solid var(--line);border-radius:4px;display:block;background:#0d1220;cursor:zoom-in;}
#lb{position:fixed;inset:0;z-index:95;display:none;place-items:center;padding:36px;background:#05070cee;backdrop-filter:blur(3px);cursor:zoom-out;}
#lb.on{display:grid;}
#lb img{max-width:min(1180px,94vw);max-height:86vh;border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 70px #000b;background:#0d1220;}
.boardcap{font-size:10px;color:var(--dim);margin-top:5px;}
/* ---------- 说明浮层 ---------- */
#about{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:22px;background:#05070cee;backdrop-filter:blur(4px);}
#about.on{display:grid;}

.abox{
  width:min(780px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  background:#141b2d;border:1px solid var(--line);border-radius:8px;box-shadow:0 26px 80px #000c;
}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-soft);}
.ahead h2{margin:0;font-size:13px;letter-spacing:.1em;color:var(--accent);font-weight:600;}
.abody{padding:14px 16px 18px;overflow-y:auto;font-size:12.5px;line-height:1.8;color:var(--muted);}
.abody::-webkit-scrollbar{width:6px;}
.abody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.abody h3{font-size:12px;color:var(--accent);margin:16px 0 6px;letter-spacing:.08em;font-weight:600;}
.abody h3:first-child{margin-top:0;}
.abody p{margin:0 0 8px;}
.abody ul{margin:0 0 8px;padding-left:17px;}
.abody li{margin-bottom:3px;}
.abody b{color:var(--ink);font-weight:600;}
.abody .q{color:var(--dim);font-size:11.5px;}
.ktab{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 10px;}
.ktab th,.ktab td{border-bottom:1px solid var(--line-soft);padding:5px 7px;text-align:left;white-space:nowrap;}
.ktab th{color:var(--dim);font-size:10.5px;font-weight:400;letter-spacing:.04em;}
.ktab td:first-child{color:var(--ink);}
.ktab td.hi{color:var(--accent);}

/* ---------- 关于（数据来源 · 版本记录） ---------- */
#colophon{position:fixed;inset:0;z-index:101;display:none;place-items:center;padding:22px;background:#05070cee;backdrop-filter:blur(4px);}
#colophon.on{display:grid;}
.abox.wide{width:min(880px,96vw);}
#cbody h3 .tag{font-size:9.5px;font-weight:400;letter-spacing:.06em;color:#1a1205;
  background:var(--accent);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:1px;}
#cbody h3 .tag.alt{background:#3d4a63;color:#c6d0e2;}
.src{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 12px;}
.src th,.src td{border-bottom:1px solid var(--line-soft);padding:7px 8px;text-align:left;vertical-align:top;line-height:1.55;}
.src th{color:var(--dim);font-size:10.5px;font-weight:400;letter-spacing:.04em;}
.src td:first-child{color:var(--ink);width:22%;}
.src td:nth-child(2){width:30%;}
.src td code{font-family:"Cascadia Code",Consolas,monospace;font-size:10.5px;color:#9fb0cd;
  background:#ffffff08;border:1px solid #ffffff12;border-radius:3px;padding:1px 4px;word-break:break-all;}
.src a{color:var(--accent);text-decoration:none;border-bottom:1px dotted #e2be7d66;}
.src a:hover{border-bottom-style:solid;}
.src em{font-style:normal;color:var(--dim);font-size:10.5px;}
.log{list-style:none;padding:0;margin:6px 0 14px;border-left:1px solid var(--line);}
.log li{position:relative;padding:0 0 13px 16px;margin:0;}
.log li::before{content:"";position:absolute;left:-3.5px;top:6px;width:6px;height:6px;
  border-radius:50%;background:var(--line);border:1px solid #141b2d;}
.log li.now::before{background:var(--accent);box-shadow:0 0 0 3px #e2be7d22;}
.log .v{font-family:"Cascadia Code",Consolas,monospace;font-size:11px;color:var(--accent);font-weight:600;}
.log .d{font-size:10.5px;color:var(--dim);margin-left:7px;letter-spacing:.02em;}
.log .t{color:var(--ink);font-weight:600;font-size:12px;margin:2px 0 3px;}
.log p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.7;}
.log ul{margin:2px 0 0;padding-left:15px;}
.log li li{padding:0;margin:0 0 2px;font-size:11.5px;line-height:1.65;}
.log li li::before{display:none;}
.note{border:1px solid var(--line);border-left:2px solid var(--accent-dim);border-radius:0 5px 5px 0;
  padding:9px 12px;font-size:11.5px;color:var(--muted);line-height:1.75;margin:0 0 14px;background:#ffffff05;}
.note b{color:var(--ink);}

/* 免责声明：与正文区分开的独立块 */
/* 第三方项目引用：与免责声明区分，用中性偏暖的灰 */
.cite{
  border:1px solid #8a9bb533;border-radius:6px;background:#8a9bb50a;
  padding:12px 14px 10px;margin:12px 0 16px;font-size:11.5px;line-height:1.75;color:#9fabc0;
}
.cite .dtitle{
  font-size:10.5px;letter-spacing:.2em;color:#a9bcd8;font-weight:600;
  margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid #8a9bb526;
}
.cite p{margin:0 0 8px;}
.cite b{color:#cfdcef;font-weight:600;}
.cite table.src{margin:4px 0 10px;font-size:11px;}
.cite table.src th{
  width:76px;white-space:nowrap;color:var(--dim);font-weight:400;
  vertical-align:top;padding:5px 7px;
}
.cite table.src td{padding:5px 7px;}
.cite code{font-family:"Cascadia Code",Consolas,monospace;font-size:10.5px;
  color:#9fb0cd;background:#ffffff08;border:1px solid #ffffff12;border-radius:3px;padding:0 3px;
  word-break:break-all;}

.disclaimer{
  border:1px solid #e2be7d33;border-radius:6px;background:#e2be7d08;
  padding:12px 14px 6px;margin:0 0 16px;font-size:11.5px;line-height:1.75;color:#9fabc0;
}
.disclaimer .dtitle{
  font-size:10.5px;letter-spacing:.2em;color:var(--accent);font-weight:600;
  margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid #e2be7d26;
}
.disclaimer p{margin:0 0 8px;}
.disclaimer b{color:#d9c9a8;font-weight:600;}
.disclaimer.flash{animation:dflash 1.4s ease-out;}
@keyframes dflash{0%{border-color:var(--accent);box-shadow:0 0 0 3px #e2be7d33}100%{border-color:#e2be7d33;box-shadow:none}}
.disclaimer code{font-family:"Cascadia Code",Consolas,monospace;font-size:10.5px;
  color:#9fb0cd;background:#ffffff08;border:1px solid #ffffff12;border-radius:3px;padding:0 3px;}

/* AI 生成声明：与免责声明区分，用中性偏冷的蓝调 */
.ai-decl{
  border:1px solid #5b7fa833;border-radius:6px;background:#5b7fa80a;
  padding:12px 14px 6px;margin:0 0 14px;font-size:11.5px;line-height:1.8;color:#9fabc0;
}
.ai-decl p{margin:0 0 9px;}
.ai-decl b{color:#c3d4e8;font-weight:600;}
.ai-decl .src{margin:4px 0 10px;font-size:11px;}
.ai-decl .src td,.ai-decl .src th{padding:6px 7px;}
.ai-decl .src td:first-child{width:30%;}
.ai-decl .src td:nth-child(2){width:18%;}
.ktab kbd{
  display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;
  font-family:"Cascadia Code",Consolas,monospace;font-size:10px;color:var(--ink);
  background:#0f1526;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
}
.route{
  font-family:"Cascadia Code",Consolas,monospace;font-size:11.5px;line-height:1.9;
  background:#0f1526;border:1px solid var(--line-soft);border-radius:4px;padding:8px 10px;
  color:var(--accent);word-break:break-all;letter-spacing:.06em;
}
.routeNote{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.6;}
/* 解法分段 */
.solStat{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--dim);margin-bottom:8px;font-variant-numeric:tabular-nums;}
.solStat b{color:var(--accent);font-weight:600;font-size:11.5px;}
.segs{display:flex;flex-wrap:wrap;gap:4px;max-height:240px;overflow-y:auto;padding:1px 1px 4px;}
/* 分阶段的超长关卡：给更高一些的视口，段首标题占满一行 */
.segs.staged{max-height:420px;display:block;padding:0 1px 4px;}
.segs.staged .seg,.segs.staged .swap{display:inline-flex;margin:0 4px 4px 0;}
.stageHead{
  display:flex;align-items:center;gap:7px;width:100%;
  margin:10px 0 5px;padding:4px 0 4px 7px;border-left:2px solid var(--accent-dim);
  font-size:10px;color:var(--dim);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.stageHead:first-child{margin-top:0;}
.stageHead>span{
  background:#e2be7d1a;border:1px solid #e2be7d40;color:var(--accent);
  border-radius:3px;padding:1px 6px;font-size:10px;font-weight:600;letter-spacing:.02em;
}
.stageHead>em{font-style:normal;margin-left:auto;color:#5d6a82;font-size:9.5px;}
.segs::-webkit-scrollbar{width:5px;}
.segs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.seg{
  display:inline-flex;align-items:baseline;gap:1px;font-family:"Cascadia Code",Consolas,monospace;
  font-size:11px;line-height:1;color:var(--muted);background:#ffffff07;border:1px solid var(--line-soft);
  border-radius:3px;padding:4px 5px;
}
.seg b{color:var(--accent);font-size:12px;font-weight:600;}
.seg i{font-style:normal;color:var(--dim);font-size:9.5px;margin-left:1px;}
.seg.act{background:#e2be7d12;border-color:#e2be7d2e;gap:3px;padding:3px 6px 3px 4px;}
/* 动作键卡：左边是当前平台的实际按键（带键帽底），右边是动作名 */
.seg.act b.k{
  color:#1a1205;background:#e2be7d;border-radius:3px;
  padding:1.5px 5px;font-size:10.5px;font-weight:700;letter-spacing:0;
  min-width:16px;text-align:center;
}
.seg.act s{
  text-decoration:none;font-family:inherit;font-size:9.5px;letter-spacing:0;
  color:#9aa6bb;margin-left:1px;
}
.seg.act.sw s{color:#c8a86a;}
/* 停顿两级：1 拍是浅灰小点，≥2 拍是要等满的琥珀标签 */
.seg.wait1{background:#ffffff08;border-color:#ffffff14;padding:3px 5px;}
.seg.wait1 b{color:#7d889c;font-size:9px;letter-spacing:0;}
.seg.waitlong{background:#f0a54a1f;border-color:#f0a54a66;box-shadow:inset 0 0 0 1px #f0a54a22;}
.seg.waitlong b{color:#ffc987;font-size:9.5px;letter-spacing:0;font-weight:700;}
.solStat .warn{color:#ffc987;}
.solStat .warn b{color:#ffd9a8;}
.seg.sw{padding:4px 6px;}
.seg.sw b{font-size:10.5px;letter-spacing:.02em;}
/* 单角色关里「换角色」单独占一行，把路线切成若干段 */
.swap{
  flex:1 0 100%;display:flex;align-items:center;justify-content:center;gap:8px;
  margin:5px 0;font-size:10.5px;letter-spacing:.1em;color:#f5dfb4;
}
.swap::before,.swap::after{content:"";height:1px;flex:1;max-width:46px;}
.swap::before{background:linear-gradient(90deg,#e2be7d00,#e2be7d66);}
.swap::after{background:linear-gradient(90deg,#e2be7d66,#e2be7d00);}
.swap span{
  white-space:nowrap;background:#e2be7d1a;border:1px solid #e2be7d3d;
  border-radius:999px;padding:2px 10px;
}
.swap i{font-style:normal;color:var(--dim);font-size:9.5px;letter-spacing:0;margin-left:-3px;}
.swap i.note{margin-left:5px;color:#8d99ad;font-size:9px;}
.swap b{
  display:inline-block;margin-left:4px;background:#e2be7d;color:#1a1205;
  border-radius:3px;padding:1px 5px;font-size:10px;font-weight:700;letter-spacing:0;
  font-family:"Cascadia Code",Consolas,monospace;
}
.hseg{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-bottom:5px;font-size:11px;color:var(--dim);}
.hseg>u{
  text-decoration:none;color:var(--accent);border:1px solid var(--accent-dim);
  border-radius:3px;padding:2px 6px;font-size:10px;white-space:nowrap;
}
.solBar{display:flex;gap:6px;margin-top:8px;}
.solBar button{
  flex:1;height:28px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--muted);
  font-size:11px;cursor:pointer;transition:.15s;
}
.solBar button:hover{color:var(--accent);border-color:var(--accent-dim);}
details.alt{border:1px dashed var(--line);border-radius:4px;padding:8px 10px;margin-top:8px;}
details.alt>summary{cursor:pointer;font-size:11.5px;color:var(--accent);letter-spacing:.02em;}
details.alt>summary::marker{color:var(--dim);}
details.alt[open]>summary{margin-bottom:8px;}
/* 存储不可用警示条：常驻顶部，可关闭但刷新后仍会出现 */
.saveWarn{display:none;position:fixed;left:0;right:0;top:0;z-index:9000;
  padding:9px 44px 9px 16px;font-size:12.5px;line-height:1.6;
  background:#5a2b2b;color:#ffd9d9;border-bottom:1px solid #8a4444;}
.saveWarn.on{display:block;}
.saveWarn b{color:#ffb3b3;}
.saveWarn button{position:absolute;right:10px;top:8px;background:none;border:0;
  color:#ffd9d9;font-size:16px;cursor:pointer;padding:0 6px;line-height:1;}
.saveWarn button:hover{color:#fff;}
.saveWarn.on ~ header{top:0;}

.altWarn{margin-top:8px;padding:7px 10px;border-left:2px solid #c8a45c;background:#c8a45c14;
  font-size:11px;line-height:1.75;color:#e0c08a;border-radius:0 3px 3px 0;margin-bottom:8px;}
.altWarn b{color:#f0d3a0;}
.rawsec{display:none;margin-top:8px;}
.rawsec.on{display:block;}
.hsegs{max-height:240px;overflow-y:auto;padding-bottom:2px;}
.hsegs::-webkit-scrollbar{width:5px;}
.hsegs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.dimnote{font-style:normal;color:var(--dim);font-size:10px;}
.hintline{font-size:10px;color:var(--dim);margin:-2px 0 6px;}
.platbar{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0 7px;}
.platbar button{
  height:24px;padding:0 9px;border:1px solid var(--line-soft);border-radius:4px;background:none;
  color:var(--dim);font-size:10.5px;cursor:pointer;
}
.platbar button:hover{color:var(--muted);border-color:var(--line);}
.platbar button.on{color:var(--accent);border-color:var(--accent-dim);background:#e2be7d12;}
.keygrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:10.5px;color:var(--muted);margin-bottom:2px;}
.keygrid span{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.keygrid kbd{
  display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;
  font-family:"Cascadia Code",Consolas,monospace;font-size:10px;color:var(--ink);
  background:#0f1526;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
}
.keygrid em{font-style:normal;color:var(--dim);}
.platnote{font-size:9.5px;color:#78859e;line-height:1.5;margin:4px 0 0;}
.maplayer{font-size:9.5px;color:var(--dim);border:1px solid var(--line-soft);border-radius:3px;padding:1px 5px;}
.links{display:flex;flex-wrap:wrap;gap:6px;}
.links a,.links .lnkbtn{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);
  text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 9px;
  background:none;cursor:pointer;font-family:inherit;
}
.links a:hover,.links .lnkbtn:hover{color:var(--accent);border-color:var(--accent-dim);}
/* ---------- 外部攻略跳转 ---------- */
.guide{display:flex;flex-direction:column;gap:6px;}
.guide a{
  display:flex;align-items:center;gap:8px;text-decoration:none;
  border:1px solid var(--line);border-radius:5px;padding:7px 9px;color:var(--muted);
  transition:border-color .15s,background .15s;
}
.guide a:hover{border-color:var(--accent-dim);background:#e2be7d0f;}
.guide .gi{
  flex:none;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;
  font-size:9px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;
}
.guide .gi.wt{background:#7fa8d91a;color:#8fb6e0;border:1px solid #7fa8d933;}
.guide .gi.yt{background:#e05a5a1a;color:#e08585;border:1px solid #e05a5a33;}
.guide .gi.bl{background:#5ac9e01a;color:#7fd0e0;border:1px solid #5ac9e033;}
.guide .gt{flex:1;min-width:0;font-size:11.5px;line-height:1.35;color:var(--ink);}
.guide .gt small{display:block;color:var(--dim);font-size:9.5px;margin-top:1px;letter-spacing:.02em;}
.guide .go{flex:none;color:var(--dim);font-size:11px;}
.guide .gmiss{font-size:10.5px;color:var(--dim);padding:2px 1px 0;line-height:1.6;}
.guide .gmiss b{color:#8d99ad;font-weight:600;}
.none{font-size:12px;color:var(--dim);line-height:1.7;padding:9px 10px;border:1px dashed var(--line);border-radius:4px;}
.pfoot{
  padding:10px 14px;border-top:1px solid var(--line-soft);display:flex;gap:6px;align-items:center;
  background:#18223a;
}
.btnDone{
  flex:1;height:34px;background:transparent;border:1px solid var(--accent-dim);border-radius:4px;
  color:var(--accent);font-size:12.5px;cursor:pointer;transition:.15s;letter-spacing:.04em;
}
.btnDone:hover{background:#e2be7d1a;}
.btnDone.on{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600;}
.navB{
  width:34px;height:34px;border:1px solid var(--line);background:transparent;border-radius:4px;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;
}
.navB:hover{color:var(--ink);border-color:var(--accent-dim);}
.navB:disabled{opacity:.3;cursor:default;}

/* ---------- index drawer ---------- */
#index{
  position:fixed;top:calc(var(--h) + 10px);left:10px;bottom:10px;width:290px;z-index:44;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:visible;box-shadow:0 18px 50px #050914aa;
  /* 收起：面板完全退出屏幕（右缘停在 0），把手 right:-16 时左缘落在 0，正好整块可见 */
  /* 收起：面板完全退出屏幕，把手独立固定在左缘（不随侧栏移动） */
  transform:translateX(calc(-100% - 10px));
  transition:transform .28s cubic-bezier(.3,.8,.3,1);
}
#index.open{transform:none;}
/* 把手：固定定位，收起时贴在屏幕左缘，展开时贴在侧栏右缘（位置由 JS 设置 left） */
#idxHandle{
  position:fixed;top:50%;transform:translateY(-50%);left:0;z-index:46;
  width:16px;height:52px;padding:0;cursor:pointer;
  display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);border-left:0;
  border-radius:0 6px 6px 0;color:var(--muted);
  box-shadow:5px 0 14px #05091466;
  transition:left .28s cubic-bezier(.3,.8,.3,1),color .15s,background .15s;
}
#idxHandle:hover{color:var(--accent);background:var(--surface-2);}
#idxHandle svg{transition:transform .28s cubic-bezier(.3,.8,.3,1);}
/* 收起时箭头朝右（点这里展开） */
#idxHandle.closed svg{transform:rotate(180deg);}
/* 内容区自己裁切，把手才不会被 overflow 吃掉 */
#index>.ihead,#index>#ilist{position:relative;}
.ihead{padding:12px 14px 10px;border-bottom:1px solid var(--line-soft);
  border-radius:var(--radius) var(--radius) 0 0;}
.ihead h2{margin:0;font-size:12px;letter-spacing:.18em;color:var(--ink);font-weight:600;}
.ihead p{margin:4px 0 0;font-size:10.5px;color:var(--dim);line-height:1.6;}
#ilist{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;
  border-radius:0 0 var(--radius) var(--radius);}
#ilist::-webkit-scrollbar{width:6px;}
#ilist::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.ag{margin-bottom:2px;}
.ahrow{display:flex;align-items:center;gap:2px;}
.ahrow>button.ah{flex:1;min-width:0;}
/* 左侧小三角：展开/收起关卡列表（和「筛选」区分开） */
.aexp{
  flex:none;width:16px;height:22px;padding:0;border:0;background:none;cursor:pointer;
  color:var(--dim);display:grid;place-items:center;border-radius:3px;
}
.aexp:hover{color:var(--ink);background:var(--surface-2);}
.aexp svg{transition:transform .2s;}
.ag.open .aexp svg{transform:rotate(90deg);}
/* 被筛选的区域整行高亮 */
.ag.filtered>.ahrow .ah{background:#e2be7d1f;color:var(--ink);}
.ag.filtered>.ahrow .ah .dot{box-shadow:0 0 0 2px #e2be7d55;}
.achk{
  flex:none;width:22px;height:22px;border-radius:4px;cursor:pointer;
  background:none;border:1px solid var(--line);color:var(--dim);
  font-size:10px;font-family:inherit;line-height:1;display:grid;place-items:center;
}
.achk:hover{color:var(--accent);border-color:var(--accent-dim);background:#e2be7d14;}
.achk.on{color:#1a1205;background:var(--accent);border-color:var(--accent);font-weight:700;}
.batch{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.batch button{
  flex:1 1 calc(50% - 3px);min-width:0;height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:1px solid var(--line);border-radius:4px;
  color:var(--muted);font-size:10.5px;font-family:inherit;cursor:pointer;
}
.batch button:hover{color:var(--accent);border-color:var(--accent-dim);background:#e2be7d14;}
.ag .ah{
  width:100%;display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--ink);
  padding:7px 8px;border-radius:4px;cursor:pointer;font-size:12px;text-align:left;
}
.ag .ah:hover{background:var(--surface-2);}
.ag .dot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;}
.ag .cnt{margin-left:auto;color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums;}
.alist{display:none;padding:0 0 4px;}
.ag.open .alist{display:block;}
.ai{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;color:var(--muted);
  padding:4px 8px 4px 22px;border-radius:3px;cursor:pointer;font-size:11.5px;line-height:1.4;
  white-space:nowrap;overflow:hidden;
}
.ai>span:first-child{overflow:hidden;text-overflow:ellipsis;}
.ai small{margin-left:auto;font-size:9px;color:var(--dim);flex:none;}
.gsec{margin-bottom:6px;}
.gsec>h4{
  margin:8px 0 2px;padding:0 8px;font-size:9.5px;font-weight:600;letter-spacing:.12em;
  color:var(--dim);display:flex;align-items:center;gap:6px;
}
.gsec>h4::after{content:"";height:1px;flex:1;background:var(--line-soft);}
.gsec>h4>em{font-style:normal;font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;}
.iempty{padding:22px 12px;text-align:center;color:var(--dim);font-size:11.5px;}
.ai:hover{background:var(--surface-2);color:var(--ink);}
.ai.done{color:var(--accent);}
.ai.act{background:#e2be7d1f;color:var(--ink);}
/* 即时性徽章：只由长停顿（≥2 拍）决定 */
.badge{margin-left:5px;font-size:9px;border-radius:3px;padding:1px 5px;border:1px solid;
  vertical-align:1px;white-space:nowrap;letter-spacing:.02em;}
.badge.b-hot{color:#ffb765;border-color:#f0a54a66;background:#f0a54a1a;}
.badge.b-warm{color:#e9c98c;border-color:#e2be7d40;background:#e2be7d14;}
.badge.b-mild{color:#8d99ad;border-color:#ffffff1f;background:#ffffff08;}
.badge.b-chill{color:#7b8798;border-color:#ffffff14;background:#ffffff05;}
.ai .bdg{margin-left:auto;font-size:9px;flex:none;}
.ai .bdg.b-hot{color:#ffb765;}
.ai .bdg.b-warm{color:#e9c98c;}
.ai .bdg.b-mild{color:#66748a;}
.ai .bdg.b-chill{color:#5b687d;}
/* 地图点位：即时关加一圈脉冲，扫图时能一眼找到 */
.mk.u-hot{box-shadow:0 0 0 1.4px #0a0e18, 0 0 0 2.9px #ffb765, 0 0 0 5px #ffb7652e, 0 2px 5px #0008;}
.mk.u-hot::before{content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1.5px solid #ffb765aa;animation:mkpulse 2.4s ease-out infinite;}
@keyframes mkpulse{0%{transform:scale(.62);opacity:.85}70%{transform:scale(1.65);opacity:0}100%{opacity:0}}
.mk.u-warm{box-shadow:0 0 0 1.4px #0a0e18, 0 0 0 2.9px #e9c98c, 0 2px 5px #0008;}
/* 有停顿的关（含只等 1 拍的）在外圈加一道虚线，和纯解谜关区分开 */
.mk.u-mild{box-shadow:0 0 0 1.4px #0a0e18, 0 0 0 2.9px #a39a86, 0 2px 5px #0008;}
.mk.u-chill{box-shadow:0 0 0 1.4px #0a0e18, 0 0 0 2.9px #7d8698, 0 2px 5px #0008;}
@media (prefers-reduced-motion:reduce){ .mk.u-hot::before{animation:none;opacity:.4;} }

@media (max-width:620px){
  header{gap:7px;padding:0 9px;}
  .brand b{font-size:11px;letter-spacing:.14em;}
  .search{display:none;}
  #btnFit{display:none;}
  #maptabs button{padding:0 6px;}
  .credit{font-size:9px;}
}
@media (max-width:820px){
  .brand span{display:none;}
  #maptabs button{padding:0 7px;font-size:11px;}
  #maptabs button b{display:none;}
  .search input{width:130px;}
  .search input:focus{width:160px;}
  #panel{left:6px;right:6px;width:auto;top:auto;bottom:6px;max-height:68vh;
    transform:translateY(calc(100% + 12px));}
  #panel.open{transform:none;}
  #hud{width:calc(100% - 28px);}
  #index{width:calc(100% - 34px);max-width:320px;}
  /* 移动端把手加宽一点，方便拇指点（left 由 JS 控制，这里只管尺寸） */
  #idxHandle{width:20px;height:64px;}
}
</style>

<body>

<div class="saveWarn" id="saveWarn" role="alert">
  <span id="saveWarnMsg"></span>
  <button id="saveWarnX" aria-label="关闭">×</button>
</div>

<header>
  <div class="brand" title="Order of the Sinking Star">
    <svg class="starmark" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
      <path d="M12 1.5 Q12.7 11.3 22.5 12 Q12.7 12.7 12 22.5 Q11.3 12.7 1.5 12 Q11.3 11.3 12 1.5 Z"
            fill="currentColor"/>
    </svg>
    <span data-i18n="brand.sub">沉星之序 · 交互地图</span>
  </div>
  <div class="hsep"></div>
  <div id="maptabs">
    <button data-layer="ground" class="on"><span data-i18n="layer.ground">主世界</span> <b>466</b></button>
    <button data-layer="sky"><span data-i18n="layer.sky">天空</span> <b>233</b></button>
    <button data-layer="under"><span data-i18n="layer.under">地下</span> <b>221</b></button>
  </div>

<script src="data/i18n.js"></script>
<script>
(function(){
  "use strict";
  const D = window.MAPDATA, G = window.GUIDES || {};
  const LEVELS = D.levels, AREAS = D.areas, META = D.meta, PINS = D.pins || [];
  const MAPS = META.maps;
  const LAYER_CN = {ground:"主世界", sky:"天空", under:"地下"};
  const LAYER_EN = {ground:"Overworld", sky:"Sky", under:"Under"};
  // 地图层名按语言取
  const LAYER_NAME = ly => (isEN() ? LAYER_EN : LAYER_CN)[ly] || ly;

  const GROUP_CN = {hub:"枢纽", north:"北方 · 搬运英雄", east:"东方 · 镜之群岛", south:"南方 · 飞石成径",
                    west:"西方 · 光束发射器之库", hybrid:"黄金房 · 融合", "3d":"三维区域", end:"终局"};
  const GROUP_EN = {hub:"Hub", north:"North · Heroes of Hauling", east:"East · The Mirror Isles",
                    south:"South · Skipping Stones", west:"West · Vault of the Beamcasters",
                    hybrid:"Gold Rooms · Hybrid", "3d":"3D areas", end:"Endgame"};
  const GROUP_NAME = g => (isEN() ? GROUP_EN : GROUP_CN)[g] || g;

  const state = { scale: 0.35, tx: 0, ty: 0, sel: null, area: "all", q: "", layer: "ground",
                  plat: "pc", done: new Set() };
  const LS = "ootss-map-v2";

  // 存储读取可能抛错（隐私模式 / 禁用站点数据），统一兜住，
  // 否则一处异常就会中断整个脚本，页面变成白屏。
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  // 返回是否写入成功。调用方需要知道结果——写失败时必须告诉用户，
  // 否则界面显示「已通过」但实际没存住，刷新就复位（用户反馈过这个问题）。
  const lsSet = (k, v) => {
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  };
  // 存储是否可用。隐私模式、禁用站点数据、配额满都会让它为 false。
  // 一旦确认不可用，就不再每次标记都弹提示，改为顶部常驻一条警示。
  let LS_OK = true;
  function lsProbe(){
    try {
      const k = "__ootss_probe__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function load(){
    try{
      const raw = lsGet(LS);
      if (raw){
        const d = JSON.parse(raw);
        if (Array.isArray(d.done)) state.done = new Set(d.done);
        if (d.plat && ["pc","xbox","ps","sw"].includes(d.plat)) state.plat = d.plat;
      }
      const old = lsGet("ootss-map-v1");
      if (old && !state.done.size){
        const d = JSON.parse(old);
        if (Array.isArray(d.done)) state.done = new Set(d.done);
      }
    }catch(e){}
  }
  function save(){
    const ok = lsSet(LS, JSON.stringify({done:[...state.done], plat:state.plat}));
    if (!ok && LS_OK){
      LS_OK = false;
      showSaveWarning();
    }
    return ok;
  }

  // 存储不可用时的常驻警示。文案区分「无痕模式」和「一般写入失败」两种情况，
  // 因为前者是用户可预期的，后者更像是配额或站点设置问题。
  let saveWarnShown = false;
  function showSaveWarning(force){
    if (saveWarnShown && !force) return;
    saveWarnShown = true;
    const box = document.getElementById("saveWarn");
    const msg = document.getElementById("saveWarnMsg");
    if (!box || !msg) return;
    const incognito = !lsProbe();
    msg.innerHTML = isEN()
      ? (incognito
          ? '<b>Progress can\'t be saved in this browser.</b> Private/incognito mode blocks local storage, so marks will be lost when you reload or close the tab. Open the site in a normal window to keep progress.'
          : '<b>Progress cannot be saved right now.</b> Your browser refused to store data — marks will be lost on reload. Check that site data is allowed for this page, or free up storage space.')
      : (incognito
          ? '<b>当前浏览器无法保存进度。</b>无痕/隐私模式禁用了本地存储，标记通关后刷新或关闭标签页就会丢失。请用普通窗口打开本站。'
          : '<b>进度暂时无法保存。</b>浏览器拒绝了写入，标记通关后刷新会丢失。请检查是否允许本站存储数据，或清理一些存储空间。');
    box.classList.add("on");
  }


  const groupOf = a => (G[a] && G[a].g) || "hybrid";
  const byId = id => LEVELS.find(l => l.id === id);
  const pad = n => String(n).padStart(3, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---------- 本地化 ----------
     语言只有 zh / en 两种。中文是页面原文，英文靠 data/i18n.js 的词典。
     - 静态文案：HTML 上标 data-i18n="key"，applyLang() 时整段替换
     - 动态文案：代码里写 T("key", {...})
     - 区域名：「英雄与魔镜」这类不进词典，走 AR()，因为要跟关卡一起渲染
     切换语言不刷新页面：重跑 applyLang() 再 render() 一次即可。 */
  const I18N = window.I18N || {areas:{}, ui:{}};
  const LANG_KEY = "ootss-lang";
  let LANG = "zh";

  // 首屏语言：优先用户选择，其次跟随浏览器
  LANG = (lsGet(LANG_KEY) === "en" || lsGet(LANG_KEY) === "zh")
    ? lsGet(LANG_KEY)
    : (/^zh\b/i.test(navigator.language || "") ? "zh" : "en");

  const isEN = () => LANG === "en";

  // 启动时探测存储是否可用；不可用就直接弹警示，不等用户标记时才发现
  (function initSaveWarning(){
    LS_OK = lsProbe();
    const x = document.getElementById("saveWarnX");
    if (x) x.onclick = () => document.getElementById("saveWarn").classList.remove("on");
    if (!LS_OK) showSaveWarning();
  })();
  // 取词：英文缺词时回退到中文原文，不至于露出 key
  function T(key, params, fallback){
    let s = isEN() ? (I18N.ui[key] != null ? I18N.ui[key] : (fallback != null ? fallback : key)) : (fallback != null ? fallback : key);
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? params[k] : m));
    return s;
  }
  // 区域名：英文取官方译名，没有就回退中文
  const AR = a => (isEN() && I18N.areas[a]) ? I18N.areas[a] : ((AREAS[a] || {}).cn || a);

  // 区域攻略正文：英文版放在 data/i18n.js 的 guides 里，缺了回退中文原文
  const GD = () => I18N.guides || {};
  const guideText = (a, field, zh) => (isEN() && (GD()[a] || {})[field]) || zh;
  const guideTips = (a, zh) => (isEN() && (GD()[a] || {}).tips) || zh;

  function applyLang(){
    document.documentElement.lang = isEN() ? "en" : "zh-CN";
    document.body.classList.toggle("en", isEN());
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.dataset.i18n;
      // 第一次遇到就把中文原文存下来，否则切回中文时拿到的是英文
      if (el.dataset.zh == null) el.dataset.zh = el.textContent;
      el.textContent = isEN() ? T(k, null, el.dataset.zh) : el.dataset.zh;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => {
      el.dataset.zhPh = el.dataset.zhPh || el.placeholder;
      el.placeholder = isEN() ? T(el.dataset.i18nPh, null, el.dataset.zhPh) : el.dataset.zhPh;
    });
    document.querySelectorAll("[data-i18n-tip]").forEach(el => {
      el.dataset.zhTip = el.dataset.zhTip || el.title;
      el.title = isEN() ? T(el.dataset.i18nTip, null, el.dataset.zhTip) : el.dataset.zhTip;
    });
    document.querySelectorAll("[data-i18n-alt]").forEach(el => {
      el.dataset.zhAlt = el.dataset.zhAlt || el.alt;
      el.alt = isEN() ? T(el.dataset.i18nAlt, null, el.dataset.zhAlt) : el.dataset.zhAlt;
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => {
      el.dataset.zhAria = el.dataset.zhAria || el.getAttribute("aria-label");
      el.setAttribute("aria-label", isEN() ? T(el.dataset.i18nAria, null, el.dataset.zhAria) : el.dataset.zhAria);
    });
    const ct = document.getElementById("creditText");
    if (ct) ct.textContent = isEN()
      ? "Unofficial fan tool, not affiliated with Thekla, Inc. · Game content © Thekla · This page was largely AI-assisted, with factual content checked against its sources · Base maps stitched from in-game tiles (overworld / sky / under) · Area names from the game's Area Pins · Coordinates, boards and routes from the community map joric/ootss"
      : "非官方玩家工具，与 Thekla, Inc. 无关 · 游戏内容版权归 Thekla 所有 · 本页由 AI 辅助生成，事实性内容已与数据源核对 · 底图由游戏瓦片拼接（主世界 / 天空 / 地下三层）· 区域名取自游戏内 Area Pin，按官方中文译出 · 坐标、棋盘与解法来自社区地图 joric/ootss";
    const ll = document.getElementById("langLabel");
    if (ll) ll.textContent = isEN() ? "EN" : "中文";
  }

  function setLang(l){
    if (l === LANG) return;
    LANG = l;
    lsSet(LANG_KEY, l);
    applyLang();
    // 所有动态渲染都依赖 LANG，重绘一遍。
    // buildLabels / buildMarkers 内部会先清空，不会叠加；
    // 重建后必须再 applyView() 重算地名显隐，否则一个都不显示。
    buildLabels();
    buildMarkers();
    onViewChange();
    buildIndex();
    if (state.sel){
      const l2 = byId(state.sel);
      if (l2) render(l2);
    }
    // 这两个面板带 HTML 缓存，切语言要清掉重新生成
    const ab = document.getElementById("abody"), cb = document.getElementById("cbody");
    if (ab) ab.innerHTML = "";
    if (cb) cb.innerHTML = "";
  }

  /* ---------- 解法解析 ---------- */
  const ARROW = {L:"←", R:"→", U:"↑", D:"↓"};
  // 游戏键位（User.keymap 默认值）：X=Activate，C=CharacterSwitch，V=TakeOrDrop，F=FriendlyDragon。
  // 动作名一律用游戏自带简中本地化（data/strings/s-cn.localization）的原文：
  // Activate=主要动作、CharacterSwitch=切换角色、TakeOrDrop=次要动作、FriendlyDragon=特殊动作、
  // Undo=撤销、Restart=重新开始。
  // 录像里的 B 不对应任何默认按键，位置在需要停顿一拍的地方，按“等”处理。
  // 动作键不再用自造符号，改由 chipHTML 按当前平台直接显示键位（见 ACT_SHORT）。
  const KEYNAME = {X:"主要动作", C:"切换角色", V:"次要动作", F:"特殊动作", B:"停顿一拍"};
  const keyName = k => isEN()
    ? ({X:"Activate", C:"Switch hero", V:"Take/Drop", F:"Dragon", B:"Wait a beat"}[k] || k)
    : (KEYNAME[k] || "动作");
  const PLATS = {
    pc:   {cn:"PC 键盘", en:"PC keyboard", move:"WASD",      enMove:"WASD", X:"X", C:"C / 1–9", V:"V", F:"F", undo:"Z", restart:"R"},
    xbox: {cn:"Xbox",    en:"Xbox",        move:"左摇杆",    enMove:"Left stick", X:"X", C:"B", V:"A", F:"LB", undo:"Y", restart:"View"},
    ps:   {cn:"PlayStation", en:"PlayStation", move:"左摇杆", enMove:"Left stick", X:"□", C:"○", V:"✕", F:"L1", undo:"△", restart:"Create"},
    sw:   {cn:"Switch",  en:"Switch",      move:"左摇杆",    enMove:"Left stick", X:"Y", C:"A", V:"B", F:"L", undo:"X", restart:"－"}
  };
  // 平台名 / 摇杆名按当前语言取
  const P = k => { const p = PLATS[k]; return isEN() ? { ...p, cn: p.en, move: p.enMove } : p; };
  const unpack = s => String(s).replace(/([A-Z])(\d+)/g, (_, k, n) => k.repeat(+n));
  const ACTS = "XCVBF";

  function segments(str){
    const out = [];
    for (const c of String(str)){
      if (!/[A-Z]/.test(c)) continue;
      const last = out[out.length - 1];
      if (last && last.k === c) last.n++;
      else out.push({k:c, n:1});
    }
    return out;
  }

  function parseSol(s){
    if (!s) return null;
    const parts = String(s).trim().split(/\s+/);
    const legal = parts.every(p => /^[1-8]?[LRUDXCVBF]*$/.test(p));
    const hasHero = parts.some(p => /^[1-8]/.test(p));
    if (legal && hasHero){
      const groups = [];
      let cur = 0;
      for (const p of parts){
        const m = p.match(/^([1-8])(.*)$/);
        const moves = m ? m[2] : p;
        if (m) cur = +m[1];
        groups.push({h:cur, segs: segments(unpack(moves))});
      }
      return {multi:true, groups};
    }
    return {multi:false, segs: segments(unpack(s))};
  }

  // 动作键（X/C/V/F）直接显示「当前平台的实际按键」，不再用 ⇅ 这类自造符号 ——
  // 玩家对着手柄找键时，看到的是 A / ✕ / B，而不是需要再翻译一次的图形。
  // 官方中文名：Activate=主要动作、CharacterSwitch=切换角色、TakeOrDrop=次要动作、FriendlyDragon=特殊动作。
  const ACT_SHORT = {X:"主要", C:"切换", V:"次要", F:"特殊"};
  const actShort = k => isEN()
    ? ({X:"Act", C:"Switch", V:"Drop", F:"Dragon"}[k] || k)
    : (ACT_SHORT[k] || k);

  // 解法串里的角色编号 -> 职业名（社区解法约定，全局固定）。
  // 一律用职业名，不带人名：玩家在游戏里选择的就是这几个角色。
  const HERO_CN = {1:"战士", 2:"盗贼", 3:"法师", 4:"牧师", 5:"吟游诗人", 6:"德鲁伊", 7:"商人"};
  const HERO_EN = {1:"Warrior", 2:"Thief", 3:"Wizard", 4:"Priest", 5:"Bard", 6:"Druid", 7:"Merchant"};
  const heroName = h => (isEN() ? HERO_EN : HERO_CN)[h] || null;

  function chipHTML(sg, prev, nextHero){
    const dir = "LRUD".indexOf(sg.k) >= 0;
    const p = P(state.plat);
    const cnt = sg.n > 1 ? `<i>×${sg.n}</i>` : "";
    let tip, cls = "seg";

    if (dir){
      tip = isEN()
        ? `Move ${({L:"left",R:"right",U:"up",D:"down"})[sg.k]} ${sg.n} tile(s) (${p.cn}: ${p.move})`
        : `向${({L:"左",R:"右",U:"上",D:"下"})[sg.k]}移动 ${sg.n} 格（${p.cn}：${p.move}）`;
      return `<span class="${cls}" title="${tip}"><b>${ARROW[sg.k]}</b>${cnt}</span>`;
    }

    if (sg.k === "B"){
      // 停顿分两级：1 拍只是让画面跟上，≥2 拍是真的要等，
      // 尤其是拿/放之后的 4 拍 —— 抢按会失败，这才是「即时性」的来源。
      const sec = (sg.n * 0.25).toFixed(2).replace(/\.?0+$/, "");
      if (sg.n >= 2){
        cls += " waitlong";
        tip = isEN()
          ? (prev === "V"
              ? `After a Take/Drop, wait the full ${sg.n} beats (~${sec}s) for the object to settle. Pressing early fails.`
              : `Wait the full ${sg.n} beats (~${sec}s) before continuing; don't press anything in between.`)
          : (prev === "V"
              ? `次要动作之后要等满 ${sg.n} 拍（约 ${sec} 秒），等物体吸附稳定再继续，抢按会失败。`
              : `要等满 ${sg.n} 拍（约 ${sec} 秒）再继续，中间不要按别的键。`);
      } else {
        cls += " wait1";
        tip = isEN()
          ? "Wait one beat for the animation (a marker in recordings, not a key)"
          : "等一拍，让动画走完（录像里的等待标记，不是按键）";
      }
      const label = sg.n > 1 ? (isEN() ? "W" + sg.n : "等" + sg.n) : "·";
      return `<span class="${cls}" title="${tip}"><b>${label}</b></span>`;
    }

    // 动作键：键位字母 + 斜杠 + 动作名，例如 PC 的「V/Drop」、Xbox 的「A/Drop」
    const key = p[sg.k] || "—";
    tip = `${keyName(sg.k)} · ${p.cn} ${key}${sg.n > 1 ? ` ×${sg.n}` : ""}`;
    if (sg.k === "C" && nextHero && heroName(nextHero))
      tip = isEN()
        ? `Switch to ${heroName(nextHero)} · ${p.cn} ${key}`
        : `切换到「${heroName(nextHero)}」 · ${p.cn}键位 ${key}`;
    cls += " act";
    if (sg.k === "C") cls += " sw";
    return `<span class="${cls}" title="${tip}"><b class="k">${key}</b><s>${actShort(sg.k)}</s>${cnt}</span>`;
  }

  // 长停顿（≥2 拍）：整个解法里有多少处、最长多少拍
  function waitStats(str){
    const u = unpack(str || "");
    const runs = [...u.matchAll(/B+/g)].map(m => m[0].length);
    const long = runs.filter(n => n >= 2);
    return {
      total: runs.length,
      longN: long.length,
      longPts: long.reduce((a, b) => a + b, 0),
      maxRun: runs.reduce((a, b) => Math.max(a, b), 0)
    };
  }

  // 即时性分级：只看长停顿（≥2 拍）。短等（1 拍）不算，避免满屏都是标记。
  // 即时性分级。只要解法里出现停顿就一定有标记 —— 哪怕只有 1 拍，
  // 那也是「要掐一下时机」的地方，不该整关没有任何提示。
  //   1 拍     → chill  「有停顿」：等一拍，容错较宽
  //   2–4 处长 → mild   「少停顿」
  //   5–19 处  → warm   「等时机」：拿放后要等稳
  //   ≥20 或 ≥10 拍连续 → hot 「即时」：等待次数多、容错低
  function urgencyOf(st){
    if (!st || !st.total) return null;
    const short = st.total - st.longN;
    const detail = isEN()
      ? [
          st.longN ? `${st.longN} long pause(s) (max ${st.maxRun} beats)` : "",
          short ? `${short} short pause(s)` : ""
        ].filter(Boolean).join(", ")
      : [
          st.longN ? `${st.longN} 处长停顿（最长 ${st.maxRun} 拍）` : "",
          short ? `${short} 处短等` : ""
        ].filter(Boolean).join("、");

    if (isEN()){
      if (st.longN >= 20 || st.maxRun >= 10)
        return {k:"hot", cn:"Tight timing", tip:`${detail} — pauses are dense, stay on the beat`};
      if (st.longN >= 5)
        return {k:"warm", cn:"Timed", tip:`${detail} — wait for it to settle after Take/Drop`};
      if (st.longN >= 1)
        return {k:"mild", cn:"Few pauses", tip:`${detail} — comfortable rhythm`};
      return {k:"chill", cn:"Has pauses", tip:`${short} short pause(s) — wait a beat after each press`};
    }
    if (st.longN >= 20 || st.maxRun >= 10)
      return {k:"hot", cn:"即时", tip:`${detail} —— 等待点密集，节奏要踩准`};
    if (st.longN >= 5)
      return {k:"warm", cn:"等时机", tip:`${detail} —— 拿放后要等稳，别抢按`};
    if (st.longN >= 1)
      return {k:"mild", cn:"少停顿", tip:`${detail}，节奏比较宽松`};
    // 只有 1 拍短等：容错宽，但仍然是需要等一下的地方
    return {k:"chill", cn:"有停顿", tip:`${short} 处短等 —— 按完等一等再走，别一口气连按`};
  }

  // 把序列渲染成卡片。flat=true（单角色关）时把「换角色」抽成整行分隔线，
  // 让「移动」和「换人」不再混在同一串符号里。
  // nextHero：多角色关里，这段末尾的「换角色」要切到谁（用于提示）。
  function segsHTML(segs, flat, nextHero){
    const p = P(state.plat);
    let prev = null;
    return segs.map(sg => {
      let html;
      if (sg.k === "C" && flat){
        const tip = isEN()
          ? `Switch hero · ${p.cn} ${p.C}${p.C.includes("1–9") ? " (digits pick directly)" : ""}`
          : `切换角色 · ${p.cn}键位 ${p.C}${p.C.includes("1–9") ? "（数字键可直接选人）" : ""}`;
        const label = isEN() ? "Switch to next hero" : "切到下一个角色";
        const note = p.C.includes(" / ") ? `<i class="note">${isEN() ? "or pick by number" : "或数字直选"}</i>` : "";
        html = `<div class="swap" title="${tip}"><span>${label} <b>${p.C.split(" / ")[0]}</b>${note}</span>${sg.n > 1 ? `<i>×${sg.n}</i>` : ""}</div>`;
      } else {
        html = chipHTML(sg, prev, sg.k === "C" ? nextHero : null);
      }
      if (sg.k !== "C") prev = sg.k;
      return html;
    }).join("");
  }

  // 徽章图标：即时 ⚡ / 等时机 ⏱ / 少停顿 · / 有停顿 ·
  const URG_ICON = {hot:"⚡", warm:"⏱", mild:"·", chill:"·"};

  function urgencyBadge(l){
    const u = urgencyOf(waitStats(l.s));
    if (!u) return "";
    return `<span class="badge b-${u.k}" title="${esc(u.tip)}">${URG_ICON[u.k]} ${u.cn}</span>`;
  }

  /* ---------- 长解法分阶段 ----------
     超长关卡（如诺言 3 共 3326 步）一屏塞不下，按两级切开：
       1. 语义边界：拿到/放下后的长停顿 V+B{n}、特殊动作 F、主要动作 X。
          同一个房间里反复搬运，这些动作天然把过程切成一个个回合。
       2. 步数兜底：一段超过 STEP_MAX 步就在最近的移动末端硬切，
          免得出现「只是走过去 300 步」这种巨型小节。
     只有超过 STAGE_MIN 步的关卡才切，短关保持原样。 */
  const STAGE_MIN = 90;    // 低于这个步数不切
  const STEP_MAX = 70;     // 单段最多这么多步

  function stagePlan(segs){
    const total = segs.reduce((a, b) => a + b.n, 0);
    if (total < STAGE_MIN) return null;

    // 先按 segs 逐段累计，用「段」作为最小切分单位（不会把 ×12 拆开）
    const marks = [];                 // 候选边界：该段之后适合断开
    let pos = 0;
    segs.forEach((sg, i) => {
      pos += sg.n;
      if (i === segs.length - 1) return;
      const next = segs[i + 1];
      // 语义边界：停顿 ≥2 拍（拿放/等待结束）、特殊动作、主要动作、换角色
      if (sg.k === "B" && sg.n >= 2) marks.push({ at: pos, i, w: 3 });
      else if (sg.k === "F") marks.push({ at: pos, i, w: 3 });
      else if (sg.k === "X") marks.push({ at: pos, i, w: 2 });
      else if (sg.k === "C") marks.push({ at: pos, i, w: 3 });
      else if (next.k === "B" && next.n >= 2) marks.push({ at: pos, i, w: 3 });
      else if (sg.k !== "B" && next.k !== "B" && next.k !== "C") marks.push({ at: pos, i, w: 1 });
    });

    // 从候选里挑：每段尽量接近 STEP_MAX，但优先落在高权重边界
    const cuts = [];
    let last = 0;
    while (pos - last > STEP_MAX) {
      const hi = last + STEP_MAX;
      const lo = last + STEP_MAX * 0.45;
      const cand = marks.filter(m => m.at > lo && m.at <= hi && m.at > last);
      if (cand.length) {
        // 同等条件下取最靠后、权重最高的
        cand.sort((a, b) => (b.w - a.w) || (b.at - a.at));
        const pick = cand[0];
        cuts.push(pick.i + 1);
        last = pick.at;
      } else {
        // 没有合适边界：在 STEP_MAX 附近找最近的移动末端兜底
        const near = marks.filter(m => m.at > last && m.at <= hi + STEP_MAX * 0.4)
          .sort((a, b) => Math.abs(a.at - hi) - Math.abs(b.at - hi))[0];
        if (!near) break;
        cuts.push(near.i + 1);
        last = near.at;
      }
    }

    if (!cuts.length) return null;
    const stages = [];
    let from = 0, step = 0;
    cuts.forEach(c => {
      const part = segs.slice(from, c);
      const n = part.reduce((a, b) => a + b.n, 0);
      stages.push({ segs: part, from: step + 1, to: step + n });
      step += n;
      from = c;
    });
    const tail = segs.slice(from);
    if (tail.length) {
      const n = tail.reduce((a, b) => a + b.n, 0);
      stages.push({ segs: tail, from: step + 1, to: step + n });
    }
    return stages.length > 1 ? stages : null;
  }

  // 逐步走法下方那段长说明。中文与英文分开写函数，比塞进词典好维护。

  function solHTML(s, extra){
    const p = parseSol(s);
    if (!p) return "";
    const all = p.multi ? p.groups.flatMap(g => g.segs) : p.segs;
    const moves = all.reduce((a, b) => a + b.n, 0);
    const nX = all.filter(x => x.k === "X").reduce((a, b) => a + b.n, 0);
    const nF = all.filter(x => x.k === "F").reduce((a, b) => a + b.n, 0);
    const nOther = all.filter(x => "CV".includes(x.k)).reduce((a, b) => a + b.n, 0);
    const dirCount = all.filter(x => "LRUD".includes(x.k)).reduce((a, b) => a + b.n, 0);
    // 停顿拆成「长等」（≥2 拍，必须等满）和「短等」（1 拍，只是让画面跟上）
    const st = waitStats(s);
    const nLong = all.filter(x => x.k === "B" && x.n >= 2);
    const nShort = all.filter(x => x.k === "B" && x.n === 1).reduce((a, b) => a + b.n, 0);

    // 分段标题：PC 显示「1 号 · 战士」（编号对应键盘 1–7 直接选人）；
    // 主机端没有数字选人，直接写职业名
    const isPC = state.plat === "pc";
    const plat = P(state.plat);
    // 段标题统一写成「怎么选到这个人 + 是谁」：
    //   PC 有数字直选，写成「按 6 · 德鲁伊」，和解法里的编号一一对应；
    //   主机没有数字键，只能按切换键循环，写成「B 切到 · 德鲁伊」。
    // 这样两种写法（编号 / 切换键）都落回同一个表述，不再一关一个样。
    const heroLabel = h => {
      if (!h) return isEN() ? "Current hero" : "当前角色";
      const cn = heroName(h);
      if (!cn) return isEN() ? `Hero ${h}` : h + " 号";
      return isPC
        ? (isEN() ? `Press ${h} · ${cn}` : `按 ${h} · ${cn}`)
        : (isEN() ? `${plat.C} until · ${cn}` : `${plat.C} 切到 · ${cn}`);
    };

    let stageCount = 0;
    const body = p.multi
      ? `<div class="hsegs">` + p.groups.map((g, gi) => {
          const next = p.groups[gi + 1];
          return `<div class="hseg"><u>${heroLabel(g.h)}</u>${g.segs.length ? segsHTML(g.segs, false, next && next.h) : '<span class="dimnote">${isEN() ? "Switch only, no movement" : "只切换，不移动"}</span>'}</div>`;
        }).join("") + `</div>`
      : (() => {
          // 超长关卡切成若干阶段，全部展开、段间加醒目分隔
          const plan = stagePlan(all);
          stageCount = plan ? plan.length : 0;
          if (!plan) return `<div class="segs">${segsHTML(all, true)}</div>`;
          return `<div class="segs staged">` + plan.map((st, i) =>
            `<div class="stageHead"><span>${isEN() ? "Stage " + (i + 1) : "第 " + (i + 1) + " 段"}</span>${isEN() ? "steps " + st.from + "–" + st.to : "第 " + st.from + "–" + st.to + " 步"}<em>${st.to - st.from + 1} ${isEN() ? "steps" : "步"}</em></div>` +
            segsHTML(st.segs, true)
          ).join("") + `</div>`;
        })();
    const scrollHint = p.multi && p.groups.length > 4 ? `<div class="hintline">${isEN() ? `${p.groups.length} hero switches, in order from top to bottom (scrolls)` : `共 ${p.groups.length} 段角色轮换，从上往下按顺序操作（区块内可滚动）`}</div>` : "";

    const E = isEN();
    return `<div class="sol"><div class="solStat">
        <span>${E ? `<b>${moves}</b> steps` : `共 <b>${moves}</b> 步`}</span>
        <span>${E ? `<b>${dirCount}</b> tiles` : `移动 <b>${dirCount}</b> 格`}</span>
        <span>${E ? `<b>${all.length}</b> segments` : `<b>${all.length}</b> 段`}</span>
        ${nX ? `<span>${E ? `<b>${nX}</b> Activate` : `主要动作 <b>${nX}</b> 次`}</span>` : ""}
        ${nOther ? `<span>${E ? `<b>${nOther}</b> other` : `其他动作 <b>${nOther}</b> 次`}</span>` : ""}
        ${nF ? `<span>${E ? `<b>${nF}</b> Dragon` : `特殊动作 <b>${nF}</b> 次`}</span>` : ""}
        ${nLong.length ? `<span class="warn">${E ? `<b>${nLong.length}</b> long wait(s)` : `须等满 <b>${nLong.length}</b> 处`}${st.maxRun >= 4 ? (E ? ` (max ${st.maxRun})` : `（最长 ${st.maxRun} 拍）`) : ""}</span>` : ""}
        ${nShort ? `<span>${E ? `<b>${nShort}</b> short waits` : `短等 <b>${nShort}</b> 拍`}</span>` : ""}
        ${p.multi ? `<span>${E ? `<b>${p.groups.length}</b> hero switches` : `<b>${p.groups.length}</b> 个角色轮换`}</span>` : ""}
        ${stageCount ? `<span>${E ? `<b>${stageCount}</b> stages` : `分 <b>${stageCount}</b> 段操作`}</span>` : ""}
        ${extra ? `<span>${extra}</span>` : ""}
      </div>
      ${scrollHint}
      ${body}
      <div class="solBar">
        <button data-copy="${esc(s)}">${E ? "Copy route" : "复制路线"}</button>
        <button data-raw="1">${E ? "Show raw string" : "显示原始串"}</button>
      </div>
      <div class="rawsec"><div class="route">${esc(s)}</div></div></div>`;
  }

  /* ---------- 构建 ---------- */
  const stage = document.getElementById("stage");
  const panel = document.getElementById("panel");
  const phead = document.getElementById("phead");
  const pbody = document.getElementById("pbody");

  /* ---------- 地图引擎（Leaflet） ----------
     坐标系用 CRS.Simple：关卡数据里的 px/py 就是底图像素坐标，
     直接当 Leaflet 的 latlng 用（y 轴向下，所以传给 L.latLng 时取 -py 翻一下，
     再配合 L.CRS.Simple 的变换，视觉上与原来的像素坐标完全一致）。

     zoom 0 时 1 个瓦片覆盖整图；每加 1，瓦片数翻倍。
     tiles 目录里的结构与此一致（见 tools/make-tiles.py）。 */

  const MAP_W = META.w, MAP_H = META.h;
  // 源图 px -> Leaflet latlng。
  // 自定义 CRS 的 y 已经随像素向下增长，所以这里不再翻转 ——
  // 翻了会得到负瓦片号（z4/0_-2.jpg），那是取不到图的。
  const toLL = (px, py) => [py, px];
  const fromLL = ll => ({ px: ll.lng, py: ll.lat });

  // CRS.Simple 默认 1 个 latlng 单位 = 1 个屏幕像素，
  // 而我们的坐标单位是源图像素（最宽 6400），这样 z0 时整图会被放大 25 倍，
  // 瓦片编号也全乱（会去请求不存在的 z0/12_10.jpg）。
  // 用自定义 CRS 把「源图像素」换算成「Leaflet 世界坐标」：
  // z0 时 1 个世界单位恰好 = 1 个瓦片像素，整图 256px。
  // 这样 zoom 与 tiles 目录的层级就是一一对应的。
  // transformation 的系数 = 「z0 时整图占多少像素」/ 「整图世界宽」
  // 这里让 z0 的整图恰好铺满一个 256px 瓦片，与 tiles 目录层级严格对齐。
  const K = 256 / MAP_W;
  const CRS_MAP = L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(K, 0, K, 0),
    scale: z => Math.pow(2, z),
    zoom: s => Math.log(s) / Math.LN2,
    infinite: true,
  });

  const map = L.map("map", {
    crs: CRS_MAP,
    minZoom: 0,
    maxZoom: 5,
    zoomSnap: 0.25,          // 允许平滑的中间缩放级别，滚轮不会一格一格跳
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 90,
    zoomControl: false,
    attributionControl: false,
    maxBoundsViscosity: 0.85,
    updateWhenZooming: false,
    keepBuffer: 2,
    fadeAnimation: true,
    zoomAnimation: true,
  });

  // 世界坐标 = 源图像素，bounds 就是整张图的范围
  const bounds = L.latLngBounds(toLL(0, MAP_H), toLL(MAP_W, 0));

  let tileLayer = null;

  function tileURL(ly){
    // {s} 不用；z/x/y 交给 Leaflet 填
    return `assets/tiles/${ly}/{z}/{x}_{y}.jpg`;
  }

  function setLayer(ly){
    if (!MAPS[ly]) return;
    const changed = state.layer !== ly;
    state.layer = ly;

    if (tileLayer) map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(tileURL(ly), {
      tileSize: 256,
      minZoom: 0,
      maxZoom: 5,
      maxNativeZoom: 5,
      maxBounds: bounds,
      // 瓦片是有限集合，越界时不要向服务器要 404
      bounds: bounds,
      keepBuffer: 2,
      // 先给个底色，避免瓦片到位前一片白
      className: "basemap-tile",
    }).addTo(map);

    document.querySelectorAll("#maptabs button").forEach(b => b.classList.toggle("on", b.dataset.layer === ly));
    applyFilter();
    if (changed) buildIndex();
  }

  function fit(){
    map.fitBounds(bounds, { padding: [8, 8], animate: false });
    applyView();
  }

  function centerOn(px, py, z){
    const targetZ = z != null ? z : Math.max(map.getZoom(), 2);
    map.setView(toLL(px, py), targetZ, { animate: true, duration: 0.45 });
    // 面板占了右侧一部分，把中心点往左挪，让选中的关卡落在可视区中央
    setTimeout(syncPanelOffset, 460);
  }

  // 侧栏/面板展开时，把地图中心往左偏，避免被面板盖住
  function syncPanelOffset(){
    if (!map) return;
    const panelOpen = panel.classList.contains("open") && stage.clientWidth > 820;
    const idxOpen = document.getElementById("index").classList.contains("open") && stage.clientWidth > 820;
    const dx = panelOpen ? 210 : 0;
    const dy = idxOpen ? 0 : 0;
    if (dx) map.panBy([dx / 2, dy], { animate: false });
  }

  // 标记与地名跟着 Leaflet 的视图变化重排。
  // 都挂在 Leaflet 的 overlayPane 里，这样能复用它的平移/缩放容器，
  // 但尺寸由我们自己按当前 zoom 反算，保持屏幕上恒定大小。
  let mkLayer = null, lbLayer = null;

  function applyView(){
    if (!map) return;
    const z = map.getZoom();
    // 图层被 placeOverlay() 按 k 整体缩放了，标记/地名要反着缩回去保持屏幕恒定大小
    const k = scaleAt(z);
    // 元素最终宽度 = 自身宽 * k * inv，想要屏幕上恒定 11px 就得 inv = 1/k
    const inv = 1 / k;
    if (mkLayer) mkLayer.style.setProperty("--inv", inv.toFixed(4));
    if (lbLayer) lbLayer.style.setProperty("--linv", inv.toFixed(4));
    // 小比例（整图铺满时）不画标记上的投影光晕：
    // 920 个点各带三层 box-shadow + 径向渐变，挤在一起时浏览器要逐个光栅化，
    // 这正是「地图很小时缩放很卡」的主因。只留底色圆点，视觉上反而更干净。
    const dense = z < 2;
    if (mkLayer) mkLayer.classList.toggle("dense", dense);

    const minor = z >= 2.5;
    if (lbLayer){
      lbLayer.querySelectorAll(".alab").forEach(el => {
        const on = el.dataset.ly === state.layer && (el.classList.contains("major") || minor);
        el.classList.toggle("on", on);
      });
    }
  }

  function buildMarkers(){
    if (!mkLayer){
      mkLayer = document.createElement("div");
      mkLayer.id = "markers";
      // leaflet-zoom-animated：Leaflet 只给带这个类的元素加
      // `transition: transform .25s`，缩放时才会逐帧插值。
      // 少了它，zoomanim 设的终值会立刻生效，看起来就是「标点先跳过去、
      // 地图再慢慢缩」。
      mkLayer.className = "leaflet-pane mkpane leaflet-zoom-animated";
    }
    mkLayer.innerHTML = "";
    const frag = document.createDocumentFragment();
    LEVELS.forEach(l => {
      const b = document.createElement("button");
      const u = urgencyOf(waitStats(l.s));
      b.className = "mk g-" + groupOf(l.a) + (u ? " u-" + u.k : "");
      // 位置写一次即可，后续视图变化不再改动
      b.style.left = l.px + "px";
      b.style.top = l.py + "px";
      b.dataset.id = l.id;
      b.dataset.ly = l.ly;
      b.dataset.px = l.px;
      b.dataset.py = l.py;
      b.title = l.t + (u ? ` · ${u.cn}` : "");
      b.setAttribute("aria-label", l.t);
      frag.appendChild(b);
    });
    mkLayer.appendChild(frag);
    positionMkLayer();
  }

  // 把 6400x5600 的「源图坐标系」映射到 Leaflet 的 overlayPane。
  // overlayPane 用的是「层坐标」（已含平移，但缩放要自己处理），
  // 所以对一个固定尺寸的 DOM 容器先按 zoom 缩放，再把原点对齐。
  // 把 6400x5600 的「源图坐标系」映射到 Leaflet 的 mapPane。
  //
  // 为什么用 mapPane：缩放动画期间 Leaflet 给 mapPane 套一个逐帧插值的
  // transform(_animateZoom)，而 overlayPane 只是它的子容器、自身不被插值。
  // 挂 overlayPane 上的元素只能等 zoomend 一次性跳过去，就会出现「缩放完才移动」。
  //
  // 代价是 mapPane 缩放时子元素会被一起放大，所以标记/地名要按 1/k 反向缩放，
  // 而且必须跟着动画逐帧更新 —— 见 onZoomAnim。
  function placeOverlay(layer){
    if (!layer || !map) return;
    // 缩放动画进行中时，transform 由 onZoomAnim 交给 CSS transition 负责，
    // 这里再写终值会把动画打断（元素直接跳到终点）。
    if (zoomAnimating) return;
    const pane = map.getPane("mapPane");
    if (!pane.contains(layer)) pane.appendChild(layer);
    layer.style.position = "absolute";
    layer.style.left = "0";
    layer.style.top = "0";
    layer.style.width = MAP_W + "px";
    layer.style.height = MAP_H + "px";
    layer.style.transformOrigin = "0 0";
    const k = scaleAt(map.getZoom());
    const o = paneOrigin();
    layer.style.transform = `translate(${o.x}px, ${o.y}px) scale(${k})`;
  }

  // 当前 zoom 对应的世界->屏幕倍率
  function scaleAt(z){ return Math.pow(2, z) * (256 / MAP_W); }

  // 覆盖层左上角（对应源图 0,0）在 mapPane 坐标系里的位置。
  //
  // mapPane 自身的 transform 就是 _getMapPanePos() 的平移，
  // 所以挂在它里面的子元素要用「不含 pane 平移」的层坐标 —— 也就是
  // latLngToLayerPoint 的结果再减掉 pane 偏移。
  // 注意：拖动地图时 Leaflet 改的是 mapPane 的 transform，子元素跟着一起动，
  // 不需要我们重新算；只有 zoom 变化才需要重排（尺寸变了）。
  function paneOrigin(){
    return map.latLngToLayerPoint(toLL(0, 0)).subtract(map._getMapPanePos());
  }

  // Leaflet 在缩放动画的每一帧都会抛 zoomanim，这里带着目标层级的参数，
  // 据此同步覆盖层，标记就能跟瓦片一起动，而不是等动画结束才跳。
  // 标记/地名的 transition 只在缩放动画期间开启。
  // 拖动时每帧都在改 translate，若一直挂着 transition 会「拖尾」不跟手。
  let zoomAnimating = false;
  function beginZoomAnim(){
    if (zoomAnimating) return;
    zoomAnimating = true;
    if (mkLayer) mkLayer.classList.add("zooming");
    if (lbLayer) lbLayer.classList.add("zooming");
  }
  function endZoomAnim(){
    if (!zoomAnimating) return;
    zoomAnimating = false;
    if (mkLayer) mkLayer.classList.remove("zooming");
    if (lbLayer) lbLayer.classList.remove("zooming");
    // 动画期间 placeOverlay 是跳过状态，这里补一次精确对位，
    // 保证终态与瓦片严丝合缝（也顺手修掉浮点误差的累计）。
    positionMkLayer();
    positionLbLayer();
  }

  function onZoomAnim(e){
    if (!map || !mkLayer) return;
    beginZoomAnim();
    const z = e.zoom;
    const k = scaleAt(z);
    const o = zoomOrigin(e);
    [mkLayer, lbLayer].forEach(layer => {
      if (!layer) return;
      layer.style.transform = `translate(${o.x}px, ${o.y}px) scale(${k})`;
    });
    // 反向缩放，让标记在屏幕上保持恒定大小（与瓦片同步逐帧变化）
    const inv = 1 / k;
    if (mkLayer) mkLayer.style.setProperty("--inv", inv.toFixed(4));
    if (lbLayer) lbLayer.style.setProperty("--linv", inv.toFixed(4));
  }

  // zoomanim 事件里，Leaflet 用它自己的 _latLngToNewLayerPoint 计算动画目标位置，
  // 这里复刻同样的换算，保证与瓦片完全一致。
  function zoomOrigin(e){
    const scale = map.getZoomScale(e.zoom, map.getZoom());
    const offset = map._latLngToNewLayerPoint(toLL(0, 0), e.zoom, e.center)
      .subtract(map._getMapPanePos().multiplyBy(scale));
    return offset;
  }

  function positionMkLayer(){
    if (!mkLayer) return;
    placeOverlay(mkLayer);
    // 标记的 left/top 只在 buildMarkers() 里设一次就够了 ——
    // 它们是固定不变的源图坐标，每次视图变化重设 920 次是纯浪费。
  }

  // 每次视图变化：重排覆盖层，并同步标记尺寸
  // 只在地图层级变化时重排覆盖层。
  // 拖动（move）时 mapPane 的 transform 已经带着子元素一起走了，
  // 再对 920 个节点逐个写 style 纯属浪费 —— 那正是小比例下拖动/缩放卡顿的来源。
  let lastZoomForLayout = null;
  function onViewChange(){
    const z = map.getZoom();
    if (z !== lastZoomForLayout){
      lastZoomForLayout = z;
      positionMkLayer();
      positionLbLayer();
    }
    applyView();
  }

  function positionLbLayer(){
    if (!lbLayer) return;
    placeOverlay(lbLayer);
    // 同上：地名位置是固定的，只在 buildLabels 时设一次
  }

  function buildLabels(){
    if (!lbLayer){
      lbLayer = document.createElement("div");
      lbLayer.id = "labels";
      lbLayer.className = "leaflet-pane lbpane leaflet-zoom-animated";
    }
    lbLayer.innerHTML = "";
    const frag = document.createDocumentFragment();
    PINS.forEach(p => {
      const el = document.createElement("div");
      el.className = "alab" + (p.major ? " major" : "");
      el.textContent = isEN() ? (p.en || p.cn) : p.cn;
      el.title = isEN() ? `${p.cn} · ${LAYER_NAME(p.ly)}` : `${p.en} · ${LAYER_NAME(p.ly)}`;
      el.dataset.ly = p.ly;
      el.dataset.px = p.px;
      el.dataset.py = p.py;
      el.style.left = p.px + "px";
      el.style.top = p.py + "px";
      frag.appendChild(el);
    });
    lbLayer.appendChild(frag);
    positionLbLayer();
  }

  // 滚轮交给 Leaflet 处理（它自带节流与瓦片调度），不再自己算 transform
  document.getElementById("zin").onclick = () => map.zoomIn(0.5);
  document.getElementById("zout").onclick = () => map.zoomOut(0.5);

  document.getElementById("btnFit").onclick = fit;
  // 语言切换：中英互切，记住选择
  document.getElementById("btnLang").onclick = () => setLang(isEN() ? "zh" : "en");

  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fit, 150); });

  /* ---------- 点标记选关 ---------- */
  // 用事件委托绑在 stage 上：标记是动态重建的，绑在标记本身会在换语言/换层后失效。
  // 同时要区分「拖动地图」和「点了一下」—— 拖完手松开不该跳转。
  let mkDown = null;
  stage.addEventListener("pointerdown", e => {
    mkDown = e.target.closest && e.target.closest(".mk");
  });
  stage.addEventListener("pointerup", e => {
    const mk = e.target.closest && e.target.closest(".mk");
    if (mk && mk === mkDown) openLevel(+mk.dataset.id, true);
    mkDown = null;
  });
  // 键盘（Tab + Enter）激活
  stage.addEventListener("click", e => {
    if (e.detail !== 0) return;
    const mk = e.target.closest(".mk");
    if (mk) openLevel(+mk.dataset.id, true);
  });

  /* ---------- 悬浮提示 ---------- */
  const tip = document.getElementById("tip");
  stage.addEventListener("mouseover", e => {
    const mk = e.target.closest(".mk");
    if (!mk) return;
    const l = byId(+mk.dataset.id);
    tip.innerHTML = `<b>${esc(l.t)}</b><i>${esc(AR(l.a))} · ${LAYER_NAME(l.ly)} · #${pad(l.id)}</i>`;
    tip.classList.add("on");
  });
  stage.addEventListener("mousemove", e => {
    tip.style.left = e.clientX + "px";
    tip.style.top = e.clientY + "px";
  });
  stage.addEventListener("mouseout", e => {
    if (e.target.closest(".mk")) tip.classList.remove("on");
  });

  /* ---------- 筛选（已并入左侧「关卡索引」：点区域名即筛选） ---------- */
  function spread(ls){
    const xs = ls.map(l=>l.px), ys = ls.map(l=>l.py);
    return Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
  }

  function setArea(a){
    // 再点一次同一个区域 = 取消筛选
    if (a !== "all" && state.area === a) a = "all";
    state.area = a;
    markActiveArea();
    if (a !== "all"){
      const all = LEVELS.filter(l => l.a === a);
      if (all.length){
        const cnt = {};
        all.forEach(l => { cnt[l.ly] = (cnt[l.ly] || 0) + 1; });
        const dom = Object.keys(cnt).sort((x,y) => cnt[y] - cnt[x])[0];
        setLayer(dom);
        const ls = all.filter(l => l.ly === dom);
        const cx = ls.reduce((s,l)=>s+l.px,0)/ls.length;
        const cy = ls.reduce((s,l)=>s+l.py,0)/ls.length;
        const sp = spread(ls) || 300;
        centerOn(cx, cy, Math.max(0.55, Math.min(1.8, 780 / sp)));
        applyFilter();
        return;
      }
    }
    applyFilter();
    fit();
  }

  // 侧栏里标出当前筛选的区域，并刷新头部摘要
  function markActiveArea(){
    document.querySelectorAll("#ilist .ag").forEach(ag =>
      ag.classList.toggle("filtered", state.area !== "all" && ag.dataset.area === state.area));
    updateSummary();
  }

  function applyFilter(){
    const q = state.q.toLowerCase();
    document.querySelectorAll(".mk").forEach(el => {
      const l = byId(+el.dataset.id);
      let show = l.ly === state.layer;
      if (state.area !== "all" && l.a !== state.area) show = false;
      // 中英双语都能搜：输入中文命中中文名，输入英文命中英文名
      if (q && !(l.t.toLowerCase().includes(q) || AR(l.a).toLowerCase().includes(q)
        || ((AREAS[l.a] || {}).cn || "").includes(q) || LAYER_NAME(l.ly).toLowerCase().includes(q))) show = false;
      el.classList.toggle("hide", !show);
    });
  }

  /* ---------- 进度 ---------- */
  function refreshProgress(){
    document.querySelectorAll(".mk").forEach(el => el.classList.toggle("done", state.done.has(+el.dataset.id)));
    document.getElementById("pct").textContent = `${state.done.size} / ${LEVELS.length}`;
    document.getElementById("pbar").style.width = (state.done.size / LEVELS.length * 100).toFixed(1) + "%";
    document.querySelectorAll(".ai").forEach(b => b.classList.toggle("done", state.done.has(+b.dataset.id)));
    // 索引里的分组计数与「全」按钮状态就地更新，不重建列表（否则展开状态和滚动位置会丢）
    document.querySelectorAll("#ilist .ag").forEach(ag => {
      const ls = LEVELS.filter(l => l.a === ag.dataset.area && l.ly === state.layer);
      const doneN = ls.filter(l => state.done.has(l.id)).length;
      const cnt = ag.querySelector(".cnt");
      if (cnt) cnt.textContent = (doneN ? doneN + "/" : "") + ls.length;
      const chk = ag.querySelector(".achk");
      if (chk){
        const allDone = doneN === ls.length;
        chk.classList.toggle("on", allDone);
        chk.title = allDone ? (isEN() ? "Clear this group's marks" : "取消这一组的已通过标记") : (isEN() ? "Mark this whole group as cleared" : "把这一组全部标为已通过");
      }
    });
    const isum = document.getElementById("isum");
    if (isum) updateSummary();
  }

  // 索引头部摘要：优先显示「当前筛选的区域」，否则显示整层概况
  function updateSummary(){
    const isum = document.getElementById("isum");
    if (!isum) return;
    if (state.area !== "all" && AREAS[state.area]){
      const ls = LEVELS.filter(l => l.a === state.area && l.ly === state.layer);
      const d = ls.filter(l => state.done.has(l.id)).length;
      isum.innerHTML = isEN()
        ? `<b>${esc(AR(state.area))}</b> · ${ls.length} filtered (${d}/${ls.length} cleared)
        <button class="clearflt">Show all</button>`
        : `<b>${esc(AR(state.area))}</b> · 已筛选 ${ls.length} 关（${d}/${ls.length} 已通过）
        <button class="clearflt">显示全部</button>`;
      const b = isum.querySelector(".clearflt");
      if (b) b.onclick = () => setArea("all");
      return;
    }
    const onLayer = LEVELS.filter(l => l.ly === state.layer);
    const d = onLayer.filter(l => state.done.has(l.id)).length;
    isum.innerHTML = isEN()
      ? `<b>${LAYER_NAME(state.layer)}</b> · ${document.querySelectorAll("#ilist .ag").length} areas · ${d}/${onLayer.length} cleared`
      : `<b>${LAYER_NAME(state.layer)}</b> · ${document.querySelectorAll("#ilist .ag").length} 个区域 · ${d}/${onLayer.length} 关已通过`;
  }

  /* ---------- 面板 ---------- */

  // 动作名取游戏简中原文：主要动作 / 切换角色 / 次要动作 / 特殊动作 / 撤销 / 重新开始。
  // 具体按键字母来自游戏键位默认表（可改键），界面文案以动作为准，避免与改键后的实际键位冲突。
  const PLAT_NOTE_EN = {
    pc: "PC default bindings (remappable in game): X Activate, C CharacterSwitch (1–9 picks directly), V Take/Drop, F FriendlyDragon, Z Undo, R Restart. Hold Space to speed up time, hold Left Ctrl to slow it (works in any level, bullet-time style, purely an accessibility aid). A “W” in a route means wait one beat, not a key press.",
    xbox: "Xbox defaults: X Activate, B CharacterSwitch, A Take/Drop, LB FriendlyDragon, Y Undo, View Restart. Fully remappable in game.",
    ps: "PlayStation follows the Xbox button positions: □ Activate, ○ CharacterSwitch, ✕ Take/Drop, L1 FriendlyDragon, △ Undo, Create Restart. Remappable — trust your own settings.",
    sw: "Switch follows the Xbox button positions: Y Activate, A CharacterSwitch, B Take/Drop, L FriendlyDragon, X Undo, － Restart. Remappable — trust your own settings."
  };
  const PLAT_NOTE = {
    pc: "PC 默认键位（游戏内可改键）：X 主要动作，C 切换角色（1–9 直接选人），V 次要动作，F 特殊动作，Z 撤销，R 重新开始。按住空格加快时间流逝、按住左 Ctrl 放慢时间（任何关卡都能用，类似子弹时间，纯属操作辅助）。路线里的「等」= 停顿一拍，不是按键。",
    xbox: "Xbox 默认键位：X 主要动作，B 切换角色，A 次要动作，LB 特殊动作，Y 撤销，View 重新开始。游戏内可自由改键。",
    ps: "PlayStation 按 Xbox 的按键位置对应：□ 主要动作、○ 切换角色、✕ 次要动作、L1 特殊动作、△ 撤销、Create 重新开始。游戏内可自由改键，以实际设置为准。",
    sw: "Switch 按 Xbox 的按键位置对应：Y 主要动作、A 切换角色、B 次要动作、L 特殊动作、X 撤销、－ 重新开始。游戏内可自由改键，以实际设置为准。"
  };

  function platBarHTML(){
    return `<div class="platbar">` + Object.entries(PLATS).map(([k, p]) =>
      `<button data-plat="${k}" class="${state.plat === k ? "on" : ""}">${isEN() ? p.en : p.cn}</button>`
    ).join("") + `</div>`;
  }

  function keyGridHTML(){
    const p = P(state.plat);
    const L = isEN()
      ? {move:"Move", X:"Activate", C:"Switch hero", V:"Take/Drop", F:"Dragon", undo:"Undo"}
      : {move:"移动", X:"主要动作", C:"切换角色", V:"次要动作", F:"特殊动作", undo:"撤销"};

<h3>工具链</h3>
<ul>
  <li><code>tools/build-maps.js</code> — 投影坐标、写官方中文地名、校验本地化漂移</li>
  <li><code>tools/build-solutions.js</code> — 合并社区解法、备用解与视频链接</li>
  <li><code>tools/fetch-walkthrough.js</code> / <code>fetch-wtimg.js</code> / <code>hash-wtimg.js</code> / <code>build-walkthrough.py</code> —
      抓取攻略站、把每道题的截图压成 dHash 指纹与本站棋盘比对，生成 <code>data/walkthrough.js</code>
      （指纹缓存只有 106KB，不必留着 41MB 原图）</li>
  <li><code>tools/check-upstream.py</code> — 比 git blob sha，检查坐标数据是否落后于上游 <code>joric/ootss</code></li>
  <li><code>tools/make-zh-map.py</code> / <code>ocr.ps1</code> — 早期中文底图标注（已被本地化文件方案取代）</li>
</ul>
<p class="q">重建数据：<code>node tools/build-maps.js &amp;&amp; node tools/build-solutions.js</code>。
外部攻略：<code>node tools/fetch-walkthrough.js &amp;&amp; node tools/fetch-wtimg.js &amp;&amp; python tools/build-walkthrough.py</code>。
游戏更新后，把新的 <code>s-cn.localization</code> 覆盖到 <code>local/</code> 再跑一次即可同步中文名。</p>
