# ⚠️ 这个文件只服务于「直传部署」（tools/deploy-cf.js），
#    不参与 Cloudflare Pages 的 Git 自动构建。
#
# Git 自动构建的配置全部在控制台里填，见 CLOUDFLARE-GIT.md。
# 构建时 Pages 不会执行 wrangler，也不需要这些字段。
#
# 直传部署（可选，需要 API 令牌）：
#   CLOUDFLARE_API_TOKEN=xxx CLOUDFLARE_ACCOUNT_ID=yyy npm run deploy:cf
#
# 为什么不把输出目录写成 "." ：
#   直传走 auth 的 assets API 时，dist/ 由 tools/pack-dist.js 精确控制内容，
#   不依赖仓库里是否存在 dist（它已被 .gitignore 排除）。

name = "order-of-the-sinking-star"
compatibility_date = "2026-11-19"

# 仅在 wrangler pages deploy 时生效；Git 构建忽略此字段
pages_build_output_dir = "./dist"
